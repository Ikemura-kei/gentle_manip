# [dppo-finetune] PPO-finetune the banana PointNet diffusion policy on the LIVE soft
# banana sim, with the `regrasp` reward term (single_lift_banana_soft_easy_retry
# experiment) added on top of the normal stress/dist/lift shaping -- an RL-only
# incentive to re-approach + re-close the gripper after a failed first attempt, since
# BC alone (both plain BC and both ReTVL variants) provably cannot break the
# hover/freeze local optimum at the retry decision point -- see
# docs/cross_category_specialist_log.md.
# Used by: third_party/dppo/script/run.py (TrainPPOImgDiffusionAgent) via gentle_manip.dppo.train
# Status: experimental (banana regrasp-hover fix, RL-finetune priority #3)
#
# A serl_sim_server --experiment single_lift_banana_soft_easy_retry --view student
# must be serving on env.specific.port with matching n_envs (NOT the plain
# single_lift_banana_soft_easy experiment -- that one has no regrasp reward term).
# base_policy_path = the best pre-ReTVL banana BC checkpoint (41% canonical SR,
# rpfpw/checkpoint/state_450.pt) -- deliberately NOT a ReTVL checkpoint, since both
# ReTVL variants were confirmed (via video review) to still hover with no genuine
# second-attempt regrasp, so there's no reason to inherit that bias into the RL start
# point. Run with envs/dppo.
defaults:
  - _self_
hydra:
  run:
    dir: ${logdir}
  callbacks:
    experiment_snapshot:
      _target_: gentle_manip.dppo.hydra_snapshot.ExperimentSnapshot
_target_: agent.finetune.train_ppo_diffusion_img_agent.TrainPPOImgDiffusionAgent

name: ${env_name}_ppo_diffusion_pointnet_retry_ta${horizon_steps}_td${denoising_steps}_tdf${ft_denoising_steps}
logdir: ${oc.env:DPPO_LOG_DIR}/dppo-finetune/${env_name}/${exp_id:}
base_policy_path: ???        # set on CLI: rpfpw/checkpoint/state_450.pt
normalization_path: ${oc.env:DPPO_DATA_DIR}/single_lift_banana_soft_easy_pcd/normalization.npz
experiment: single_lift_banana_soft_easy_retry   # regrasp-reward task variant

seed: 42
device: cuda:0
env_name: single_lift_banana_soft_easy_pcd
obs_dim: 8
action_dim: 7
denoising_steps: 20
ft_denoising_steps: 10
cond_steps: 8
pc_cond_steps: 4
n_points: 1024
visual_feature_dim: 256
horizon_steps: 4
act_steps: 4

env:
  n_envs: 5                  # MUST match serl_sim_server --num-envs
  name: ${env_name}
  env_type: genesis
  max_episode_steps: 600     # matches the eval horizon -- long enough to reach the
                             # retry decision point (~step 268-273) AND complete a
                             # genuine second attempt afterward
  reset_at_iteration: False
  save_video: True
  use_image_obs: True
  best_reward_threshold_for_success: 100
  specific:
    obs_steps: ${cond_steps}
    act_steps: ${act_steps}
    normalization_path: ${normalization_path}
    port: 5571
    obs_keys: [ee_pos, ee_quat, gripper_width]
    pointcloud_key: point_cloud

shape_meta:
  obs:
    state:
      shape: [8]
    point_cloud:
      shape: [1024, 3]
  action:
    shape: [7]

wandb:
  entity: ${oc.env:DPPO_WANDB_ENTITY,null}
  project: gentle-manip-${env_name}
  run: ${exp_id:}
  group: dppo-finetune

train:
  n_train_itr: 500
  n_critic_warmup_itr: 10   # (added after a real observed regression) mushroom's 0
                            # let the actor update from iteration 1 with an uncalibrated
                            # critic -- iterations 10 and 20 of the first run (video-
                            # confirmed) showed the policy degrade from a clean grasp at
                            # itr 0 to never closing the gripper at all, and it did NOT
                            # recover between itr 10 and itr 20. actor_optimizer.step()
                            # is gated on itr >= n_critic_warmup_itr in DPPO's PPO loop,
                            # so this trains ONLY the critic for the first 10 iterations
                            # (on real rollout data) before the actor starts updating.
  n_steps: 150                 # MUST match env.max_episode_steps/act_steps (600/4=150)
                               # -- mirrors mushroom's proven 75=300/4 pairing. A shorter
                               # window (100, the original value here) means NO episode
                               # can ever complete within one iteration (need >=150 just
                               # to reach timeout), so both this run's diagnostic AND
                               # DPPO's periodic canonical eval (which reuses self.n_steps
                               # as max_policy_steps) can never register success --
                               # silently blind, not just uninformative. It also risks
                               # truncating genuine second-attempt training data, since
                               # the retry decision point is ~policy-step 67 and a full
                               # recovery (redescend+close+lift+hold) needs meaningfully
                               # more steps after that.
  gamma: 0.99
  augment: False
  grad_accumulate: 1
  max_grad_norm: 1.0
  actor_lr: 1e-5
  actor_weight_decay: 0
  actor_lr_scheduler:
    first_cycle_steps: 500
    warmup_steps: 10
    min_lr: 1e-5
  critic_lr: 1e-4
  critic_weight_decay: 0
  critic_lr_scheduler:
    first_cycle_steps: 500
    warmup_steps: 10
    min_lr: 1e-4
  save_model_freq: 25
  val_freq: 10
  render:
    freq: 1                   # every iteration, all envs (user request, 2026-08-27):
                              # save every episode for full video coverage of the
                              # retry-recovery behavior across all 5 parallel envs,
                              # not just periodic env0 spot-checks. NOTE: disk was at
                              # 98% (24GB free) when this was set -- watch usage.
    num: 5                    # all envs (n_envs), not just env0
  reward_scale_running: True
  reward_scale_const: 1.0
  gae_lambda: 0.95
  batch_size: 64   # mushroom's 1200 OOM'd on this 8GB card: pc_cond_steps=4 (vs
                   # mushroom's 1 -- needed to match the loaded banana checkpoint's
                   # architecture) is ~4x the PointNet cost per sample, and this loop
                   # runs WITH gradients (the actual PPO backward pass).
  update_epochs: 5
  vf_coef: 0.5
  target_kl: 1
  logprob_batch_size: 30   # mushroom's 500 also OOM'd (single un-split forward pass
                           # for small rollouts); same pc_cond_steps=4 cost reasoning.
                           # Must be divisible by env.n_envs=5 (DPPO assertion).

model:
  _target_: model.diffusion.diffusion_ppo.PPODiffusion
  gamma_denoising: 0.99
  clip_ploss_coef: 0.01
  clip_ploss_coef_base: 0.01
  clip_ploss_coef_rate: 3
  randn_clip_value: 3
  min_sampling_denoising_std: 0.1
  min_logprob_denoising_std: 0.1
  network_path: ${base_policy_path}
  actor:
    _target_: gentle_manip.dppo.pointnet_diffusion.PointNetDiffusionMLP
    action_dim: ${action_dim}
    horizon_steps: ${horizon_steps}
    cond_dim: ${eval:'${obs_dim} * ${cond_steps}'}
    pc_cond_steps: ${pc_cond_steps}
    visual_feature_dim: ${visual_feature_dim}
    time_dim: 16
    mlp_dims: [512, 512, 512]
    activation_type: ReLU
    residual_style: True
    pointnet:
      in_channels: 3
      use_layernorm: True
      final_norm: layernorm
  critic:
    _target_: gentle_manip.dppo.pointnet_diffusion.PointNetCritic
    cond_dim: ${eval:'${obs_dim} * ${cond_steps}'}
    pc_cond_steps: ${pc_cond_steps}
    visual_feature_dim: ${visual_feature_dim}
    mlp_dims: [256, 256, 256]
    activation_type: Mish
    residual_style: True
    pointnet:
      in_channels: 3
      use_layernorm: True
      final_norm: layernorm
  ft_denoising_steps: ${ft_denoising_steps}
  horizon_steps: ${horizon_steps}
  obs_dim: ${obs_dim}
  action_dim: ${action_dim}
  denoising_steps: ${denoising_steps}
  device: ${device}
