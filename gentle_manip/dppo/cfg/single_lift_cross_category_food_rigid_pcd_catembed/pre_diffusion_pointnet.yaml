# [dppo-pretrain] Stage 5(A): same cross-category rigid food-lift demos as
# single_lift_cross_category_food_rigid_pcd, PLUS a privileged, registry-derived
# per-category conditioning vector (gentle_manip.dppo.category_embedding: one-hot
# class + log-softness + size + aspect-ratio) concatenated alongside the point
# cloud and proprioception. Compare against the unconditioned baseline
# (single_lift_cross_category_food_rigid_pcd) on the SAME held-out eval to
# measure what the category signal buys on top of raw geometry alone.
# Used by: third_party/dppo/script/run.py (TrainDiffusionAgent) via gentle_manip.dppo.train
# Status: experimental
#
# Build the dataset first (separate --out from the baseline -- this one carries
# category_embed, the baseline intentionally does not):
#   uv run --project envs/dppo python -m gentle_manip.scripts.merge_cross_category_demos \
#       --categories mushroom raspberry apple pear kiwi egg grape tofu fish_cooked beef_raw beef_cooked \
#       --held-out cherry avocado \
#       --out $DPPO_DATA_DIR/single_lift_cross_category_food_rigid_pcd_catembed \
#       --category-embed
#
# Then train:
#   uv run --project envs/dppo python -m gentle_manip.dppo.train \
#       --config-path $(pwd)/gentle_manip/dppo/cfg/single_lift_cross_category_food_rigid_pcd_catembed \
#       --config-name pre_diffusion_pointnet
defaults:
  - _self_
hydra:
  run:
    dir: ${logdir}
  callbacks:
    experiment_snapshot:
      _target_: gentle_manip.dppo.hydra_snapshot.ExperimentSnapshot
_target_: agent.pretrain.train_diffusion_agent.TrainDiffusionAgent

name: ${env}_pre_diffusion_pointnet_ta${horizon_steps}_td${denoising_steps}
logdir: ${oc.env:DPPO_LOG_DIR}/dppo-pretrain/${env}/${exp_id:}
train_dataset_path: ${oc.env:DPPO_DATA_DIR}/${env}/train.npz
val_dataset_path: ${oc.env:DPPO_DATA_DIR}/${env}/val.npz
experiment: single_lift_mushroom_rigid   # env snapshot reference only (schema is shared across categories)

seed: 42
device: cuda:0
env: single_lift_cross_category_food_rigid_pcd_catembed
obs_dim: 8                    # ee_pos3 + ee_quat4 + gripper1 (object-count-agnostic)
action_dim: 7
category_embed_dim: 21        # gentle_manip.dppo.category_embedding.EMBEDDING_DIM
denoising_steps: 20
horizon_steps: 4
cond_steps: 2
pc_cond_steps: 1
n_points: 1024
visual_feature_dim: 256

wandb:
  entity: ${oc.env:DPPO_WANDB_ENTITY,null}
  project: gentle-manip-${env}
  run: ${exp_id:}
  group: dppo-pretrain

train:
  n_epochs: 500                 # baseline (unconditioned) converged by epoch ~300-400; match budget
  batch_size: 128
  learning_rate: 1e-4
  weight_decay: 1e-6
  lr_scheduler:
    first_cycle_steps: ${train.n_epochs}
    warmup_steps: 100
    min_lr: 1e-5
  epoch_start_ema: 10
  update_ema_freq: 5
  save_model_freq: 100
  val_freq: 10

model:
  _target_: model.diffusion.diffusion.DiffusionModel
  predict_epsilon: True
  denoised_clip_value: 1.0
  network:
    _target_: gentle_manip.dppo.pointnet_diffusion.PointNetDiffusionMLP
    action_dim: ${action_dim}
    horizon_steps: ${horizon_steps}
    cond_dim: ${eval:'${obs_dim} * ${cond_steps}'}
    category_embed_dim: ${category_embed_dim}
    pc_cond_steps: ${pc_cond_steps}
    visual_feature_dim: ${visual_feature_dim}
    time_dim: 16
    mlp_dims: [512, 512, 512]
    activation_type: ReLU
    residual_style: True
    pointnet:
      in_channels: 3
      use_layernorm: True
      final_norm: layernorm
  horizon_steps: ${horizon_steps}
  obs_dim: ${obs_dim}
  action_dim: ${action_dim}
  denoising_steps: ${denoising_steps}
  device: ${device}

ema:
  decay: 0.995

train_dataset:
  _target_: gentle_manip.dppo.pointcloud_dataset.StitchedSequencePointCloudCategoryDataset
  dataset_path: ${train_dataset_path}
  horizon_steps: ${horizon_steps}
  cond_steps: ${cond_steps}
  pc_cond_steps: ${pc_cond_steps}
  device: ${device}

val_dataset:
  _target_: gentle_manip.dppo.pointcloud_dataset.StitchedSequencePointCloudCategoryDataset
  dataset_path: ${val_dataset_path}
  horizon_steps: ${horizon_steps}
  cond_steps: ${cond_steps}
  pc_cond_steps: ${pc_cond_steps}
  device: ${device}
