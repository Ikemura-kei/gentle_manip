# [dppo-rollout-collect] RLDG-style: run the trained apple-easy SOLO specialist and harvest
# its own successful rollouts as a demo dataset (dataset/demos/single_lift_apple_rigid/
# <date>-rollout-<id>/data.pkl), for the rollout-distilled cross-category merge -- see
# gentle_manip/dppo/rollout_collector.py and docs/cross_category_specialist_log.md
# ("FINAL VERDICT" section, recommended next step #1).
# Used by: third_party/dppo/script/run.py (RolloutCollectorAgent) via gentle_manip.dppo.train
# Status: experimental
#
# Start the sim server BEFORE running:
#   env -u PYTHONPATH uv run --project envs/sim python -m gentle_manip.scripts.serl_sim_server \
#       --experiment single_lift_apple_rigid_easy --view student \
#       --num-envs 5 --render-rgb --subprocess --port 5570
#
# Then run:
#   env -u PYTHONPATH uv run --project envs/dppo python -m gentle_manip.dppo.train \
#       --config-name collect_rollouts \
#       --config-path gentle_manip/dppo/cfg/single_lift_apple_rigid_easy_pcd \
#       base_policy_path=<apple-easy solo checkpoint, e.g. .../zgdbz/checkpoint/state_500.pt>
defaults:
  - _self_
hydra:
  run:
    dir: ${logdir}
_target_: gentle_manip.dppo.rollout_collector.RolloutCollectorAgent

name: ${env_name}_collect_rollouts
logdir: ${eval_base:${base_policy_path}}/rollouts/${now:%Y-%m-%d}_${now:%H-%M-%S}
base_policy_path: ???
normalization_path: ${oc.env:DPPO_DATA_DIR}/single_lift_apple_rigid_easy_pcd/normalization.npz
experiment: single_lift_apple_rigid_easy

seed: 1000              # deliberately different base seed than canonical eval's 0
device: cuda:0
env_name: single_lift_apple_rigid_easy_pcd
obs_dim: 8
action_dim: 7
denoising_steps: 20
ft_denoising_steps: 0
cond_steps: 2
pc_cond_steps: 1
n_points: 1024
visual_feature_dim: 256
horizon_steps: 4
act_steps: 4
use_ddim: False
ddim_steps: ${ft_denoising_steps}

target_episodes: 150     # stop once this many SUCCESSFUL episodes are collected
max_batches: 80          # hard cap (80 batches * 5 envs = 400 attempts) even if target not hit
scene_group_size: 0
n_steps: 100              # policy-step horizon, same as canonical eval
render_num: 1
out_dir: null             # null = auto dataset/demos/single_lift_apple_rigid/<date>-rollout-<id>/

env:
  n_envs: 5
  name: ${env_name}
  env_type: genesis
  max_episode_steps: 400
  reset_at_iteration: False
  save_video: False        # no per-episode video needed for data collection
  use_image_obs: True
  best_reward_threshold_for_success: 0.2
  specific:
    obs_steps: ${cond_steps}
    act_steps: ${act_steps}
    normalization_path: ${normalization_path}
    port: 5570
    obs_keys: [ee_pos, ee_quat, gripper_width]
    pointcloud_key: point_cloud
    record_raw: true       # the whole point -- capture true per-physical-step raw obs/actions

shape_meta:
  obs:
    state:
      shape: [8]
    point_cloud:
      shape: [1024, 3]
  action:
    shape: [7]

wandb: null

model:
  _target_: model.diffusion.diffusion_eval.DiffusionEval
  ft_denoising_steps: ${ft_denoising_steps}
  predict_epsilon: True
  denoised_clip_value: 1.0
  randn_clip_value: 3
  use_ddim: ${use_ddim}
  ddim_steps: ${ddim_steps}
  network_path: ${base_policy_path}
  network:
    _target_: gentle_manip.dppo.pointnet_diffusion.PointNetDiffusionMLP
    action_dim: ${action_dim}
    horizon_steps: ${horizon_steps}
    cond_dim: ${eval:'${obs_dim} * ${cond_steps}'}
    pc_cond_steps: ${pc_cond_steps}
    visual_feature_dim: ${visual_feature_dim}
    time_dim: 16
    mlp_dims: [512, 512, 512]
    activation_type: ReLU
    residual_style: True
    pointnet:
      in_channels: 3
      use_layernorm: True
      final_norm: layernorm
  horizon_steps: ${horizon_steps}
  obs_dim: ${obs_dim}
  action_dim: ${action_dim}
  denoising_steps: ${denoising_steps}
  device: ${device}
