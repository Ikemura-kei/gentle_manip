# [dppo-finetune] PPO-finetune the BC diffusion-MLP on the LIVE genesis sim (rigid mushroom).
# Used by: third_party/dppo/script/run.py (TrainPPODiffusionAgent) via --config-path this dir
# Status: active
#
# Drives our batched genesis sim through the env_type="genesis" bridge (make_async ->
# build_genesis_venv -> SimEnvClient). A serl_sim_server must ALREADY be serving the SAME
# experiment+view (single_lift_mushroom_rigid, teacher) on env.specific.port with n_envs
# matching. base_policy_path = a BC-pretrained checkpoint (pre_diffusion_mlp). Reward is the
# task shaped reward from the sim (dist+lift; stress once we move to soft). Run with envs/dppo.
defaults:
  - _self_
hydra:
  run:
    dir: ${logdir}
  callbacks:                    # snapshot the env (experiment) config -> <run>/config/
    experiment_snapshot:
      _target_: gentle_manip.dppo.hydra_snapshot.ExperimentSnapshot
_target_: agent.finetune.train_ppo_diffusion_agent.TrainPPODiffusionAgent

name: ${env_name}_ppo_diffusion_mlp_ta${horizon_steps}_td${denoising_steps}_tdf${ft_denoising_steps}
logdir: ${oc.env:DPPO_LOG_DIR}/dppo-finetune/${name}/${now:%Y-%m-%d}_${now:%H-%M-%S}_${seed}
base_policy_path: ???        # set on CLI: path to a pre_diffusion_mlp checkpoint .pt
normalization_path: ${oc.env:DPPO_DATA_DIR}/single_lift_mushroom_rigid_state/normalization.npz
experiment: single_lift_mushroom_rigid_state  # env definition snapshot (task+obs+action+dr+reward)

seed: 42
device: cuda:0
env_name: single_lift_mushroom_rigid_state
obs_dim: 19
action_dim: 7
denoising_steps: 20
ft_denoising_steps: 10
cond_steps: 1
horizon_steps: 4
act_steps: 4

env:
  n_envs: 4                  # MUST match the running serl_sim_server --num-envs
  name: ${env_name}
  env_type: genesis
  max_episode_steps: 300
  reset_at_iteration: False
  save_video: False
  best_reward_threshold_for_success: 100    # not used for success here (no early term)
  specific:
    obs_steps: ${cond_steps}
    act_steps: ${act_steps}
    normalization_path: ${normalization_path}
    port: 5570
    obs_keys: [ee_pos, ee_quat, gripper_width, priv_object_pos, priv_object_rot6d, priv_object_dr_params]

wandb: null                  # smoke: no wandb

train:
  n_train_itr: 500
  n_critic_warmup_itr: 0
  n_steps: 75                 # per-env steps/itr; round(max_episode_steps / act_steps)
  gamma: 0.99
  actor_lr: 1e-4
  actor_weight_decay: 0
  actor_lr_scheduler:
    first_cycle_steps: 500
    warmup_steps: 10
    min_lr: 1e-4
  critic_lr: 1e-3
  critic_weight_decay: 0
  critic_lr_scheduler:
    first_cycle_steps: 500
    warmup_steps: 10
    min_lr: 1e-3
  save_model_freq: 50
  val_freq: 10
  render:
    freq: 1
    num: 0
  reward_scale_running: True
  reward_scale_const: 1.0
  gae_lambda: 0.95
  batch_size: 1200            # <= n_envs * n_steps * act_steps = 4*75*4
  update_epochs: 5
  vf_coef: 0.5
  target_kl: 1

model:
  _target_: model.diffusion.diffusion_ppo.PPODiffusion
  gamma_denoising: 0.99
  clip_ploss_coef: 0.01
  clip_ploss_coef_base: 0.01
  clip_ploss_coef_rate: 3
  randn_clip_value: 3
  min_sampling_denoising_std: 0.1
  min_logprob_denoising_std: 0.1
  network_path: ${base_policy_path}
  actor:
    _target_: model.diffusion.mlp_diffusion.DiffusionMLP
    time_dim: 16
    mlp_dims: [512, 512, 512]
    activation_type: ReLU
    residual_style: True
    cond_dim: ${eval:'${obs_dim} * ${cond_steps}'}
    horizon_steps: ${horizon_steps}
    action_dim: ${action_dim}
  critic:
    _target_: model.common.critic.CriticObs
    cond_dim: ${eval:'${obs_dim} * ${cond_steps}'}
    mlp_dims: [256, 256, 256]
    activation_type: Mish
    residual_style: True
  ft_denoising_steps: ${ft_denoising_steps}
  horizon_steps: ${horizon_steps}
  obs_dim: ${obs_dim}
  action_dim: ${action_dim}
  denoising_steps: ${denoising_steps}
  device: ${device}
