# [dppo-eval] Evaluate a STATE-only diffusion-MLP policy (BC or finetuned) on the rigid mushroom sim.
# Used by: third_party/dppo/script/run.py (EvalHarnessAgent) via gentle_manip.dppo.train
# Status: active
#
# Analogous to single_lift_mushroom_rigid_pcd/eval_diffusion_pointnet.yaml but for the STATE
# policy (pre_diffusion_mlp.yaml): no point cloud, no PointNet encoder -- 19-dim full privileged
# state (ee_pos3 + ee_quat4 + gripper1 + priv_object_pos3 + priv_object_rot6d6 + priv_object_dr_params2).
# Routes through the canonical eval harness (gentle_manip.evaluation.run_eval).
#
# The sim server MUST run with --view teacher (privileged full state, no cameras), NOT the
# student/point-cloud view -- set VIEW=teacher when launching dppo_eval.sbatch for this config:
#   VIEW=teacher uv run --project envs/sim python -m gentle_manip.scripts.serl_sim_server \
#       --experiment single_lift_mushroom_rigid_state --view teacher --num-envs 5 --render-rgb
#
# Then run eval:
#   uv run --project envs/dppo python -m gentle_manip.dppo.train \
#       --config-name eval_diffusion_mlp \
#       --config-path gentle_manip/dppo/cfg/single_lift_mushroom_rigid_state \
#       base_policy_path=<path/to/checkpoint.pt>
defaults:
  - _self_
hydra:
  run:
    dir: ${logdir}
_target_: gentle_manip.dppo.eval_agent.EvalHarnessAgent

name: ${env_name}_eval_diffusion_mlp_ta${horizon_steps}_td${denoising_steps}
logdir: ${eval_base:${base_policy_path}}/eval/${now:%Y-%m-%d}_${now:%H-%M-%S}
base_policy_path: ???
normalization_path: ${oc.env:DPPO_DATA_DIR}/single_lift_mushroom_rigid_state/normalization.npz
experiment: single_lift_mushroom_rigid_state   # env snapshot; rigid + orientation DR, state-only

seed: 42
device: cuda:0
env_name: single_lift_mushroom_rigid_state
obs_dim: 19
action_dim: 7
denoising_steps: 20
ft_denoising_steps: 0        # 0 = BC base policy eval; set >0 for a finetuned checkpoint
cond_steps: 1                # matches pre_diffusion_mlp.yaml (no obs history stacking)
horizon_steps: 4
act_steps: 4
use_ddim: False
ddim_steps: ${ft_denoising_steps}

# Canonical eval spec — fixed, do not change between policies.
n_episodes: 200
scene_group_size: 4          # rigid_orientation carries object shape/size DR -> rebuild every 4
                             # batches (~10 shapes / 200 ep). Needs --subprocess.
record_batches: null         # record all episodes (one clip per episode)
n_steps: 100                 # 100 * act_steps(4) = 400 sim steps = max_episode_steps
render_num: 5

env:
  n_envs: 5
  name: ${env_name}
  env_type: genesis
  max_episode_steps: 400
  reset_at_iteration: False
  save_video: True
  use_image_obs: True
  best_reward_threshold_for_success: 0.2
  specific:
    obs_steps: ${cond_steps}
    act_steps: ${act_steps}
    normalization_path: ${normalization_path}
    port: 5570
    obs_keys: [ee_pos, ee_quat, gripper_width, priv_object_pos, priv_object_rot6d, priv_object_dr_params]

shape_meta:
  obs:
    state:
      shape: [19]
  action:
    shape: [7]

wandb: null

model:
  _target_: model.diffusion.diffusion_eval.DiffusionEval
  ft_denoising_steps: ${ft_denoising_steps}
  predict_epsilon: True
  denoised_clip_value: 1.0
  randn_clip_value: 3
  use_ddim: ${use_ddim}
  ddim_steps: ${ddim_steps}
  network_path: ${base_policy_path}
  network:
    # MUST match the trained checkpoint's architecture (pre_diffusion_mlp.yaml).
    _target_: model.diffusion.mlp_diffusion.DiffusionMLP
    horizon_steps: ${horizon_steps}
    action_dim: ${action_dim}
    cond_dim: ${eval:'${obs_dim} * ${cond_steps}'}
    time_dim: 16
    mlp_dims: [512, 512, 512]
    activation_type: ReLU
    out_activation_type: Identity
    use_layernorm: False
    residual_style: True
  horizon_steps: ${horizon_steps}
  obs_dim: ${obs_dim}
  action_dim: ${action_dim}
  denoising_steps: ${denoising_steps}
  device: ${device}
