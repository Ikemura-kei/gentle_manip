# [dppo-pretrain] NON-REGRASPABLE baseline for the 8-object cross-category generalist:
# BYTE-IDENTICAL to single_lift_gen8_regrasp_pcd/pre_diffusion_pointnet.yaml except `env:`.
# Its dataset (staged by yd_gen8_pipeline VARIANT=baseline) is the SAME ~4k demos MINUS
# the failed_grasp (post-failure recovery) start family -- same objects, same direct-start
# diversity, no recovery examples. This is the control for the 3-metric comparison
# (SR / gentleness / SRxgentleness); keep the two cfgs in lock-step.
# Used by: third_party/dppo/script/run.py (TrainDiffusionAgent) via gentle_manip.dppo.train
# Status: experimental
#
# cond_steps=8 / pc_cond_steps=4: read the *trend*, not one instant.
# Model + schedule scaled for the ~8x larger dataset: mlp_dims 768x3, visual_feature_dim
# 384, batch 256, epochs 300, early-stop patience 15.
defaults:
  - _self_
hydra:
  run:
    dir: ${logdir}
  callbacks:
    experiment_snapshot:
      _target_: gentle_manip.dppo.hydra_snapshot.ExperimentSnapshot
_target_: agent.pretrain.train_diffusion_agent.TrainDiffusionAgent

name: ${env}_pre_diffusion_pointnet_ta${horizon_steps}_td${denoising_steps}
logdir: ${oc.env:DPPO_LOG_DIR}/dppo-pretrain/${env}/${exp_id:}
train_dataset_path: ${oc.env:DPPO_DATA_DIR}/${env}/train.npz
val_dataset_path: ${oc.env:DPPO_DATA_DIR}/${env}/val.npz
experiment: single_lift_xcat_diverse

seed: 42
device: cuda:0
env: single_lift_gen8_baseline_pcd
obs_dim: 8
action_dim: 7
denoising_steps: 20
horizon_steps: 4
cond_steps: 8
pc_cond_steps: 4
n_points: 1024
visual_feature_dim: 384

wandb:
  entity: ${oc.env:DPPO_WANDB_ENTITY,null}
  project: gentle-manip-${env}
  run: ${exp_id:}
  group: dppo-pretrain

train:
  n_epochs: 300
  batch_size: 256
  learning_rate: 1e-4
  weight_decay: 1e-6
  lr_scheduler:
    first_cycle_steps: ${train.n_epochs}
    warmup_steps: 150
    min_lr: 1e-5
  epoch_start_ema: 10
  update_ema_freq: 5
  save_model_freq: 25
  val_freq: 10
  early_stop_patience: 15
  early_stop_min_delta: 1e-4

model:
  _target_: model.diffusion.diffusion.DiffusionModel
  predict_epsilon: True
  denoised_clip_value: 1.0
  network:
    _target_: gentle_manip.dppo.pointnet_diffusion.PointNetDiffusionMLP
    action_dim: ${action_dim}
    horizon_steps: ${horizon_steps}
    cond_dim: ${eval:'${obs_dim} * ${cond_steps}'}
    pc_cond_steps: ${pc_cond_steps}
    visual_feature_dim: ${visual_feature_dim}
    time_dim: 16
    mlp_dims: [768, 768, 768]
    activation_type: ReLU
    residual_style: True
    pointnet:
      in_channels: 3
      use_layernorm: True
      final_norm: layernorm
  horizon_steps: ${horizon_steps}
  obs_dim: ${obs_dim}
  action_dim: ${action_dim}
  denoising_steps: ${denoising_steps}
  device: ${device}

ema:
  decay: 0.995

train_dataset:
  _target_: gentle_manip.dppo.pointcloud_dataset.StitchedSequencePointCloudDataset
  dataset_path: ${train_dataset_path}
  horizon_steps: ${horizon_steps}
  cond_steps: ${cond_steps}
  pc_cond_steps: ${pc_cond_steps}
  device: ${device}

val_dataset:
  _target_: gentle_manip.dppo.pointcloud_dataset.StitchedSequencePointCloudDataset
  dataset_path: ${val_dataset_path}
  horizon_steps: ${horizon_steps}
  cond_steps: ${cond_steps}
  pc_cond_steps: ${pc_cond_steps}
  device: ${device}
