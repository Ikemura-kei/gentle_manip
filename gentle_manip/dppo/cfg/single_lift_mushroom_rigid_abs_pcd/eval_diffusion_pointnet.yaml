# [dppo-eval] Evaluate a PointNet diffusion policy (BC or finetuned) on the rigid mushroom sim,
# ABSOLUTE action control (abs_pose_abs_gripper: pos3 + 6D-rotation6 + gripper1 = 10-dim).
# Used by: third_party/dppo/script/run.py (EvalHarnessAgent) via gentle_manip.dppo.train
# Status: active
#
# Routes through the canonical eval harness (gentle_manip.evaluation.run_eval): fixed EvalSpec
# (n_episodes=200, num_envs=5) with ±45° pitch/roll orientation DR (rigid_orientation) matching
# the CMA-ES data collection. No stress metrics (rigid).
#
# Start the sim server BEFORE running eval (rigid is fast, --subprocess needed for scene rebuilds):
#   uv run --project envs/sim python -m gentle_manip.scripts.serl_sim_server \
#       --experiment single_lift_mushroom_rigid_abs_action --view student \
#       --num-envs 5 --render-rgb --subprocess
#
# Then run eval:
#   uv run --project envs/dppo python -m gentle_manip.dppo.train \
#       --config-name eval_diffusion_pointnet \
#       --config-path gentle_manip/dppo/cfg/single_lift_mushroom_rigid_abs_pcd \
#       base_policy_path=<path/to/checkpoint.pt>
defaults:
  - _self_
hydra:
  run:
    dir: ${logdir}
_target_: gentle_manip.dppo.eval_agent.EvalHarnessAgent

name: ${env_name}_eval_diffusion_pointnet_ta${horizon_steps}_td${denoising_steps}
logdir: ${eval_base:${base_policy_path}}/eval/${now:%Y-%m-%d}_${now:%H-%M-%S}
base_policy_path: ???
normalization_path: ${oc.env:DPPO_DATA_DIR}/single_lift_mushroom_rigid_abs_pcd/normalization.npz
experiment: single_lift_mushroom_rigid_abs_action   # env snapshot; rigid + orientation DR + ABS action

seed: 42
device: cuda:0
env_name: single_lift_mushroom_rigid_abs_pcd
obs_dim: 8
action_dim: 10               # abs pos3 + 6D rotation6 + gripper1
denoising_steps: 20
ft_denoising_steps: 0        # 0 = BC base policy eval; set >0 for a finetuned checkpoint
cond_steps: 2
pc_cond_steps: 1
n_points: 1024
visual_feature_dim: 256
horizon_steps: 4
act_steps: 4
use_ddim: False
ddim_steps: ${ft_denoising_steps}

# Canonical eval spec — fixed, do not change between policies.
n_episodes: 200
scene_group_size: 4          # rigid_orientation carries object shape/size DR (scale/bend/twist/
                             # taper/axis_scale) -> rebuild every 4 batches (~10 shapes / 200 ep).
                             # Needs the sim server --subprocess (dppo_eval.sbatch always passes it).
record_batches: null         # record all episodes (one clip per episode)
n_steps: 100                 # 100 * act_steps(4) = 400 sim steps = max_episode_steps
render_num: 5

env:
  n_envs: 5
  name: ${env_name}
  env_type: genesis
  max_episode_steps: 400     # generous — demos are ~354 steps; policy may be faster/slower
  reset_at_iteration: False
  save_video: True
  use_image_obs: True
  best_reward_threshold_for_success: 0.2
  specific:
    obs_steps: ${cond_steps}
    act_steps: ${act_steps}
    normalization_path: ${normalization_path}
    port: 5570
    obs_keys: [ee_pos, ee_quat, gripper_width]
    pointcloud_key: point_cloud

shape_meta:
  obs:
    state:
      shape: [8]
    point_cloud:
      shape: [1024, 3]
  action:
    shape: [10]

wandb: null

model:
  _target_: model.diffusion.diffusion_eval.DiffusionEval
  ft_denoising_steps: ${ft_denoising_steps}
  predict_epsilon: True
  denoised_clip_value: 1.0
  randn_clip_value: 3
  use_ddim: ${use_ddim}
  ddim_steps: ${ddim_steps}
  network_path: ${base_policy_path}
  network:
    _target_: gentle_manip.dppo.pointnet_diffusion.PointNetDiffusionMLP
    action_dim: ${action_dim}
    horizon_steps: ${horizon_steps}
    cond_dim: ${eval:'${obs_dim} * ${cond_steps}'}
    pc_cond_steps: ${pc_cond_steps}
    visual_feature_dim: ${visual_feature_dim}
    time_dim: 16
    mlp_dims: [512, 512, 512]
    activation_type: ReLU
    residual_style: True
    pointnet:
      in_channels: 3
      use_layernorm: True
      final_norm: layernorm
  horizon_steps: ${horizon_steps}
  obs_dim: ${obs_dim}
  action_dim: ${action_dim}
  denoising_steps: ${denoising_steps}
  device: ${device}
