# [dppo-pretrain] BC-pretrain a PointNet diffusion policy for the 8-object CROSS-CATEGORY
# diverse-start REGRASP generalist (~4k demos: mushroom/banana/grape/kiwi/tomato/cherry/
# raspberry/egg_boiled). Baseline sibling single_lift_gen8_baseline_pcd is IDENTICAL
# except its data excludes the failed_grasp (post-failure recovery) start family.
# Used by: third_party/dppo/script/run.py (TrainDiffusionAgent) via gentle_manip.dppo.train
# Status: experimental
#
# cond_steps=8 / pc_cond_steps=4: regrasp needs the policy to read the *trend* (gripper
# settled on object vs closing on nothing; object falling away after a slip), not one instant.
# Model + schedule scaled up from the 500-demo banana configs for the ~8x larger dataset:
# mlp_dims 512x3 -> 768x3, visual_feature_dim 256 -> 384, batch 128 -> 256, epochs 250 ->
# 300, early-stop patience 8 -> 15. KEEP regrasp and baseline cfgs byte-identical apart
# from `env:` so the 3-metric comparison is apples-to-apple.
defaults:
  - _self_
hydra:
  run:
    dir: ${logdir}
  callbacks:
    experiment_snapshot:
      _target_: gentle_manip.dppo.hydra_snapshot.ExperimentSnapshot
_target_: agent.pretrain.train_diffusion_agent.TrainDiffusionAgent

name: ${env}_pre_diffusion_pointnet_ta${horizon_steps}_td${denoising_steps}
logdir: ${oc.env:DPPO_LOG_DIR}/dppo-pretrain/${env}/${exp_id:}
train_dataset_path: ${oc.env:DPPO_DATA_DIR}/${env}/train.npz
val_dataset_path: ${oc.env:DPPO_DATA_DIR}/${env}/val.npz
experiment: single_lift_xcat_diverse

seed: 42
device: cuda:0
env: single_lift_gen8_regrasp_pcd
obs_dim: 12
action_dim: 7
denoising_steps: 20
horizon_steps: 4
cond_steps: 8
pc_cond_steps: 4
n_points: 1024
visual_feature_dim: 384

wandb:
  entity: ${oc.env:DPPO_WANDB_ENTITY,null}
  project: gentle-manip-${env}
  run: ${exp_id:}
  group: dppo-pretrain

train:
  n_epochs: 300
  batch_size: 256
  learning_rate: 1e-4
  weight_decay: 1e-6
  lr_scheduler:
    first_cycle_steps: ${train.n_epochs}
    warmup_steps: 150
    min_lr: 1e-5
  epoch_start_ema: 10
  update_ema_freq: 5
  save_model_freq: 25
  val_freq: 10
  early_stop_patience: 15
  early_stop_min_delta: 1e-4

model:
  _target_: model.diffusion.diffusion.DiffusionModel
  predict_epsilon: True
  denoised_clip_value: 1.0
  network:
    _target_: gentle_manip.dppo.pointnet_diffusion.PointNetDiffusionMLP
    action_dim: ${action_dim}
    horizon_steps: ${horizon_steps}
    cond_dim: ${eval:'${obs_dim} * ${cond_steps}'}
    pc_cond_steps: ${pc_cond_steps}
    visual_feature_dim: ${visual_feature_dim}
    time_dim: 16
    mlp_dims: [768, 768, 768]
    activation_type: ReLU
    residual_style: True
    pointnet:
      in_channels: 3
      use_layernorm: True
      final_norm: layernorm
  horizon_steps: ${horizon_steps}
  obs_dim: ${obs_dim}
  action_dim: ${action_dim}
  denoising_steps: ${denoising_steps}
  device: ${device}

ema:
  decay: 0.995

train_dataset:
  _target_: gentle_manip.dppo.pointcloud_dataset.StitchedSequencePointCloudDataset
  dataset_path: ${train_dataset_path}
  horizon_steps: ${horizon_steps}
  cond_steps: ${cond_steps}
  pc_cond_steps: ${pc_cond_steps}
  device: ${device}

val_dataset:
  _target_: gentle_manip.dppo.pointcloud_dataset.StitchedSequencePointCloudDataset
  dataset_path: ${val_dataset_path}
  horizon_steps: ${horizon_steps}
  cond_steps: ${cond_steps}
  pc_cond_steps: ${pc_cond_steps}
  device: ${device}
