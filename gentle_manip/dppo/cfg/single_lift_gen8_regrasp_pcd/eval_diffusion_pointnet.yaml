# [dppo-eval] Canonical harness eval of the rigid-banana diverse-start BC policy.
# Routes through gentle_manip.evaluation.run_eval (EvalSpec: num_envs=5, seed=0).
# n_episodes=100, per-episode video (record_batches=null). Long horizon +
# early_stop_on_success so a would-be-failed first attempt has room to redescend/
# regrasp -- the behaviour this campaign is testing for.
#
# scene_group_size=1: rebuild GEOMETRY+MATERIAL every batch (=every 5 episodes);
# pose/pos/orientation resampled every episode by the harness. NOTE: earlier rigid
# evals hit a scene-group rebuild-RPC hang at >0 -- TEST with CATS='mushroom' first;
# if it hangs, fix the rebuild RPC or fall back to 0 + a wider per-reset pose DR.
#
# Server (start first, envs/sim_arrhenius):
#   serl_sim_server --experiment single_lift_xcat_diverse --view student \
#     --num-envs 5 --render-rgb --subprocess --port 5571
defaults:
  - _self_
hydra:
  run:
    dir: ${logdir}
_target_: gentle_manip.dppo.eval_agent.EvalHarnessAgent

name: ${env_name}_eval_diffusion_pointnet_ta${horizon_steps}_td${denoising_steps}
logdir: ${eval_base:${base_policy_path}}/eval/${now:%Y-%m-%d}_${now:%H-%M-%S}
base_policy_path: ???
normalization_path: ${oc.env:DPPO_DATA_DIR}/single_lift_gen8_regrasp_pcd/normalization.npz
experiment: single_lift_xcat_diverse_eval

seed: 42
device: cuda:0
env_name: single_lift_gen8_regrasp_pcd
obs_dim: 12
action_dim: 7
denoising_steps: 20
ft_denoising_steps: 0
cond_steps: 8
pc_cond_steps: 4
n_points: 1024
visual_feature_dim: 384
horizon_steps: 4
act_steps: 4
use_ddim: False
ddim_steps: ${ft_denoising_steps}

n_episodes: 100
scene_group_size: 1
record_batches: null
early_stop_on_success: true
success_grace_steps: 8   # after success/lifted-clear, run this many more policy steps then END the episode (don't idle to n_steps)
n_steps: 225
render_num: 5

env:
  n_envs: 5
  name: ${env_name}
  env_type: genesis
  max_episode_steps: 900
  reset_at_iteration: False
  save_video: True
  use_image_obs: True
  best_reward_threshold_for_success: 0.2
  specific:
    obs_steps: ${cond_steps}
    act_steps: ${act_steps}
    normalization_path: ${normalization_path}
    port: 5571
    obs_keys: [ee_pos, ee_quat, gripper_width, object_at_gripper]
    pointcloud_key: point_cloud

shape_meta:
  obs:
    state:
      shape: [12]
    point_cloud:
      shape: [1024, 3]
  action:
    shape: [7]

wandb: null

model:
  _target_: model.diffusion.diffusion_eval.DiffusionEval
  ft_denoising_steps: ${ft_denoising_steps}
  predict_epsilon: True
  denoised_clip_value: 1.0
  randn_clip_value: 3
  use_ddim: ${use_ddim}
  ddim_steps: ${ddim_steps}
  network_path: ${base_policy_path}
  network:
    _target_: gentle_manip.dppo.pointnet_diffusion.PointNetDiffusionMLP
    action_dim: ${action_dim}
    horizon_steps: ${horizon_steps}
    cond_dim: ${eval:'${obs_dim} * ${cond_steps}'}
    pc_cond_steps: ${pc_cond_steps}
    visual_feature_dim: ${visual_feature_dim}
    time_dim: 16
    mlp_dims: [768, 768, 768]
    activation_type: ReLU
    residual_style: True
    pointnet:
      in_channels: 3
      use_layernorm: True
      final_norm: layernorm
  horizon_steps: ${horizon_steps}
  obs_dim: ${obs_dim}
  action_dim: ${action_dim}
  denoising_steps: ${denoising_steps}
  device: ${device}
