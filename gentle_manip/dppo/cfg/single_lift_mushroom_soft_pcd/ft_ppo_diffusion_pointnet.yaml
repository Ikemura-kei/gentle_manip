# [dppo-finetune] PPO-finetune the PointNet diffusion policy on the LIVE soft mushroom sim.
# Used by: third_party/dppo/script/run.py (TrainPPOImgDiffusionAgent) via gentle_manip.dppo.train
# Status: experimental (DPPO step-2: point-cloud student pipeline, the real target)
#
# Drives the batched genesis sim via env_type="genesis" with a point_cloud modality
# (pointcloud_key). A serl_sim_server --experiment single_lift_mushroom_soft --view student must
# be serving on env.specific.port with matching n_envs. FULL DR (the experiment's dr=food_shape)
# is active — one random object size/shape/material per server launch; for WITHIN-run geometry
# variety launch the training server with `--scene-dr-every N` (relaunches the scene every N
# episodes, ~30-45 s each, so use a larger N). Reward is the sim's shaped reward INCLUDING the
# von-Mises stress penalty (soft mushroom). Uses the generic image finetune agent (handles
# arbitrary shape_meta.obs keys; image aug is skipped for clouds). base_policy_path = a
# pre_diffusion_pointnet checkpoint. Run with envs/dppo.
defaults:
  - _self_
hydra:
  run:
    dir: ${logdir}
  callbacks:                    # snapshot the env (experiment) config -> <run>/config/
    experiment_snapshot:
      _target_: gentle_manip.dppo.hydra_snapshot.ExperimentSnapshot
_target_: agent.finetune.train_ppo_diffusion_img_agent.TrainPPOImgDiffusionAgent

name: ${env_name}_ppo_diffusion_pointnet_ta${horizon_steps}_td${denoising_steps}_tdf${ft_denoising_steps}
logdir: ${oc.env:DPPO_LOG_DIR}/dppo-finetune/${name}/${now:%Y-%m-%d}_${now:%H-%M-%S}_${seed}
base_policy_path: ???        # set on CLI: a pre_diffusion_pointnet checkpoint .pt
normalization_path: ${oc.env:DPPO_DATA_DIR}/single_lift_mushroom_soft_pcd/normalization.npz
experiment: single_lift_mushroom_soft   # env definition (task+obs+action+dr+reward) snapshot

seed: 42
device: cuda:0
env_name: single_lift_mushroom_soft_pcd
obs_dim: 8
action_dim: 7
denoising_steps: 20
ft_denoising_steps: 10
cond_steps: 2
pc_cond_steps: 1
n_points: 1024
visual_feature_dim: 256
horizon_steps: 4
act_steps: 4

env:
  n_envs: 4                  # MUST match serl_sim_server --num-envs
  name: ${env_name}
  env_type: genesis
  max_episode_steps: 300
  reset_at_iteration: False
  save_video: False
  use_image_obs: True        # routes obs_trajs through the generic (dict-obs) img agent path
  best_reward_threshold_for_success: 100
  specific:
    obs_steps: ${cond_steps}
    act_steps: ${act_steps}
    normalization_path: ${normalization_path}
    port: 5570
    obs_keys: [ee_pos, ee_quat, gripper_width]
    pointcloud_key: point_cloud

shape_meta:
  obs:
    state:
      shape: [8]
    point_cloud:
      shape: [1024, 3]
  action:
    shape: [7]

wandb: null

train:
  n_train_itr: 500
  n_critic_warmup_itr: 0
  n_steps: 75
  gamma: 0.99
  augment: False             # point clouds: no image RandomShiftsAug
  grad_accumulate: 1         # img-agent field; 1 = no gradient accumulation
  actor_lr: 1e-5
  actor_weight_decay: 0
  actor_lr_scheduler:
    first_cycle_steps: 500
    warmup_steps: 10
    min_lr: 1e-5
  critic_lr: 1e-4
  critic_weight_decay: 0
  critic_lr_scheduler:
    first_cycle_steps: 500
    warmup_steps: 10
    min_lr: 1e-4
  save_model_freq: 50
  val_freq: 10
  render:
    freq: 1
    num: 0
  reward_scale_running: True
  reward_scale_const: 1.0
  gae_lambda: 0.95
  batch_size: 1200
  update_epochs: 5
  vf_coef: 0.5
  target_kl: 1
  logprob_batch_size: 500

model:
  _target_: model.diffusion.diffusion_ppo.PPODiffusion
  gamma_denoising: 0.99
  clip_ploss_coef: 0.01
  clip_ploss_coef_base: 0.01
  clip_ploss_coef_rate: 3
  randn_clip_value: 3
  min_sampling_denoising_std: 0.1
  min_logprob_denoising_std: 0.1
  network_path: ${base_policy_path}
  actor:
    _target_: gentle_manip.dppo.pointnet_diffusion.PointNetDiffusionMLP
    action_dim: ${action_dim}
    horizon_steps: ${horizon_steps}
    cond_dim: ${eval:'${obs_dim} * ${cond_steps}'}
    pc_cond_steps: ${pc_cond_steps}
    visual_feature_dim: ${visual_feature_dim}
    time_dim: 16
    mlp_dims: [512, 512, 512]
    activation_type: ReLU
    residual_style: True
    pointnet:
      in_channels: 3
      use_layernorm: True
      final_norm: layernorm
  critic:
    _target_: gentle_manip.dppo.pointnet_diffusion.PointNetCritic
    cond_dim: ${eval:'${obs_dim} * ${cond_steps}'}
    pc_cond_steps: ${pc_cond_steps}
    visual_feature_dim: ${visual_feature_dim}
    mlp_dims: [256, 256, 256]
    activation_type: Mish
    residual_style: True
    pointnet:
      in_channels: 3
      use_layernorm: True
      final_norm: layernorm
  ft_denoising_steps: ${ft_denoising_steps}
  horizon_steps: ${horizon_steps}
  obs_dim: ${obs_dim}
  action_dim: ${action_dim}
  denoising_steps: ${denoising_steps}
  device: ${device}
