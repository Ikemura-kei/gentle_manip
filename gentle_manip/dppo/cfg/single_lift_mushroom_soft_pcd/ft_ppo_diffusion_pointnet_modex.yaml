# [dppo-finetune] MoDex-matched PPO-finetune of the PointNet diffusion policy (soft mushroom).
# Used by: third_party/dppo/script/run.py (TrainPPOImgDiffusionAgent) via gentle_manip.dppo.train
# Status: experimental (MoDex-recipe trust-region settings; the LR-sweep runs hlbxy/okjjm/nhmim
#          all failed to beat BC — either diverged or degraded — because our earlier settings were
#          10-50x MORE aggressive than the MoDex paper's own DPPO config).
#
# Optimizer/trust-region knobs copied from MoDex (Lu et al., KTH RPL, arXiv 2606.05407), whose
# real finetune config is ~/kei/MoDex-main/dppo/cfg/robomimic/finetune/mog/
# ft_ppo_diffusion_unet_incontext_empty1.yaml:
#   actor_lr 1e-6 (min 2e-7), critic_lr 1e-4 (min 2e-5), clip_ploss_coef 0.005 / base 0.0005,
#   target_kl 0.02 (hard KL ceiling -> early-stops the epoch), update_epochs 1, max_grad_norm 1.0,
#   gamma 0.999, reward_scale_running True. These keep each update in a TIGHT trust region around
#   the BC init (diffusion log-prob grads are high-variance), so the policy improves slowly WITHOUT
#   drifting off-manifold. Reward scale is irrelevant here: DPPO normalizes advantages (norm_adv,
#   +5-95%% clip) AND running-normalizes rewards, so actor_lr is scale-invariant.
#
# DEVIATIONS from MoDex (kept from our pipeline / for throughput):
#   - Architecture: our PointNet DiffusionMLP, denoising_steps 20 / ft_denoising_steps 10, FULL
#     denoising (no DDIM) — matches the BC checkpoint. (MoDex: UNet, 100/4, DDIM.)
#   - n_envs 12 (soft-MPM is heavy; more is too slow) vs MoDex 28-32.
#   - n_steps 75 (one episode) vs MoDex 250 — for throughput at 12 heavy envs. 12 envs x 75 =
#     900 policy steps/iter (~12 episodes). Bump n_steps if advantage estimates look too noisy.
#
# A serl_sim_server --experiment single_lift_mushroom_soft --view student --num-envs 12 --render-rgb
# (+ --scene-dr-every N for within-run geometry variety) must serve on env.specific.port.
# base_policy_path = a pre_diffusion_pointnet (BC) checkpoint. Run with envs/dppo.
defaults:
  - _self_
hydra:
  run:
    dir: ${logdir}
  callbacks:                    # snapshot the env (experiment) config -> <run>/config/
    experiment_snapshot:
      _target_: gentle_manip.dppo.hydra_snapshot.ExperimentSnapshot
_target_: agent.finetune.train_ppo_diffusion_img_agent.TrainPPOImgDiffusionAgent

name: ${env_name}_ppo_diffusion_pointnet_modex_ta${horizon_steps}_td${denoising_steps}_tdf${ft_denoising_steps}
# logdir leaf = the global 5-letter experiment ID (exp_id resolver; registered in experiments.csv)
logdir: ${oc.env:DPPO_LOG_DIR}/dppo-finetune/${env_name}/${exp_id:}
base_policy_path: ???        # set on CLI: a pre_diffusion_pointnet checkpoint .pt
normalization_path: ${oc.env:DPPO_DATA_DIR}/single_lift_mushroom_soft_pcd/normalization.npz
experiment: single_lift_mushroom_soft   # env definition (task+obs+action+dr+reward) snapshot

seed: 42
device: cuda:0
env_name: single_lift_mushroom_soft_pcd
obs_dim: 8
action_dim: 7
denoising_steps: 20
ft_denoising_steps: 10
cond_steps: 2
pc_cond_steps: 1
n_points: 1024
visual_feature_dim: 256
horizon_steps: 4
act_steps: 4

env:
  n_envs: 12                 # MUST match serl_sim_server --num-envs
  name: ${env_name}
  env_type: genesis
  max_episode_steps: 300
  reset_at_iteration: False
  save_video: True           # record env-0 rollout video (needs the server --render-rgb).
                             # writes <run>/render/itr-<i>_trial-0.mp4 every train.render.freq iters
  use_image_obs: True        # routes obs_trajs through the generic (dict-obs) img agent path
  best_reward_threshold_for_success: 100
  specific:
    obs_steps: ${cond_steps}
    act_steps: ${act_steps}
    normalization_path: ${normalization_path}
    port: 5570
    obs_keys: [ee_pos, ee_quat, gripper_width]
    pointcloud_key: point_cloud

shape_meta:
  obs:
    state:
      shape: [8]
    point_cloud:
      shape: [1024, 3]
  action:
    shape: [7]

wandb:                          # enabled; disable per-run with `wandb=null`, or WANDB_MODE=offline
  entity: ${oc.env:DPPO_WANDB_ENTITY,null}   # null -> logged-in default account
  project: gentle-manip-${env_name}
  run: ${exp_id:}               # wandb run name == the experiment ID (matches the log dir)
  group: dppo-finetune

train:
  n_train_itr: 200            # MoDex: 201; gains are gradual under the tiny lr
  n_critic_warmup_itr: 0
  n_steps: 75                 # one episode/env; 12 envs -> 900 policy steps/iter (see header)
  gamma: 0.999                # MoDex (was 0.99)
  augment: False              # point clouds: no image RandomShiftsAug
  grad_accumulate: 1
  max_grad_norm: 1.0          # MoDex; keep the actor_ft grad-norm clip on
  actor_lr: 1e-6              # MoDex (was 1e-5) — tight trust region around BC
  actor_weight_decay: 0
  actor_lr_scheduler:
    first_cycle_steps: 200    # == n_train_itr (cosine cycle spans the run)
    warmup_steps: 10
    min_lr: 2e-7              # MoDex
  critic_lr: 1e-4             # MoDex (critic can move faster than the actor)
  critic_weight_decay: 0
  critic_lr_scheduler:
    first_cycle_steps: 200
    warmup_steps: 10
    min_lr: 2e-5             # MoDex
  save_model_freq: 25
  val_freq: 10
  render:
    freq: 25                 # env-0 rollout clip every 25 iters
    num: 1
  reward_scale_running: True
  reward_scale_const: 1.0
  gae_lambda: 0.95
  batch_size: 128            # MoDex (many small minibatches, 1 epoch)
  update_epochs: 1           # MoDex (was 5) — minimal off-policy drift
  vf_coef: 0.5
  target_kl: 0.02            # MoDex (was 1) — hard KL ceiling, early-stops the epoch
  logprob_batch_size: 504     # must be divisible by n_envs (12): 12*42

model:
  _target_: model.diffusion.diffusion_ppo.PPODiffusion
  gamma_denoising: 0.99
  clip_ploss_coef: 0.005      # MoDex (was 0.01)
  clip_ploss_coef_base: 0.0005  # MoDex (was 0.01) — small early-denoising clip
  clip_ploss_coef_rate: 3
  randn_clip_value: 3
  min_sampling_denoising_std: 0.1
  min_logprob_denoising_std: 0.1
  network_path: ${base_policy_path}
  actor:
    _target_: gentle_manip.dppo.pointnet_diffusion.PointNetDiffusionMLP
    action_dim: ${action_dim}
    horizon_steps: ${horizon_steps}
    cond_dim: ${eval:'${obs_dim} * ${cond_steps}'}
    pc_cond_steps: ${pc_cond_steps}
    visual_feature_dim: ${visual_feature_dim}
    time_dim: 16
    mlp_dims: [512, 512, 512]
    activation_type: ReLU
    residual_style: True
    pointnet:
      in_channels: 3
      use_layernorm: True
      final_norm: layernorm
  critic:
    _target_: gentle_manip.dppo.pointnet_diffusion.PointNetCritic
    cond_dim: ${eval:'${obs_dim} * ${cond_steps}'}
    pc_cond_steps: ${pc_cond_steps}
    visual_feature_dim: ${visual_feature_dim}
    mlp_dims: [256, 256, 256]
    activation_type: Mish
    residual_style: True
    pointnet:
      in_channels: 3
      use_layernorm: True
      final_norm: layernorm
  ft_denoising_steps: ${ft_denoising_steps}
  horizon_steps: ${horizon_steps}
  obs_dim: ${obs_dim}
  action_dim: ${action_dim}
  denoising_steps: ${denoising_steps}
  device: ${device}
