# [dppo-eval] Fragile-25 combined RLDG+VLM generalist -- held-in eval on shrimp.
defaults:
  - _self_
hydra:
  run:
    dir: ${logdir}
_target_: gentle_manip.dppo.eval_agent.EvalHarnessAgent

name: ${env_name}_eval_diffusion_pointnet_ta${horizon_steps}_td${denoising_steps}
logdir: ${eval_base:${base_policy_path}}/eval_shrimp/${now:%Y-%m-%d}_${now:%H-%M-%S}
base_policy_path: ???
normalization_path: ${oc.env:DPPO_DATA_DIR}/single_lift_fragile25_generalist_pcd/normalization.npz
experiment: single_lift_shrimp_soft_easy

seed: 42
device: cuda:0
env_name: single_lift_shrimp_soft_easy_pcd
obs_dim: 8
action_dim: 7
category_embed_dim: 24
denoising_steps: 20
ft_denoising_steps: 0
cond_steps: 2
pc_cond_steps: 1
n_points: 1024
visual_feature_dim: 256
horizon_steps: 4
act_steps: 4
use_ddim: False
ddim_steps: ${ft_denoising_steps}

n_episodes: 100
scene_group_size: 4
record_batches: null
n_steps: 75
render_num: 5

env:
  n_envs: 5
  name: ${env_name}
  env_type: genesis
  max_episode_steps: 300
  reset_at_iteration: False
  save_video: True
  use_image_obs: True
  best_reward_threshold_for_success: 0.2
  specific:
    obs_steps: ${cond_steps}
    act_steps: ${act_steps}
    normalization_path: ${normalization_path}
    port: 5580
    obs_keys: [ee_pos, ee_quat, gripper_width]
    pointcloud_key: point_cloud
    category: shrimp
    category_embed_source: vlm

shape_meta:
  obs:
    state:
      shape: [8]
    point_cloud:
      shape: [1024, 3]
    category_embed:
      shape: [24]
  action:
    shape: [7]

wandb: null

model:
  _target_: model.diffusion.diffusion_eval.DiffusionEval
  ft_denoising_steps: ${ft_denoising_steps}
  predict_epsilon: True
  denoised_clip_value: 1.0
  randn_clip_value: 3
  use_ddim: ${use_ddim}
  ddim_steps: ${ddim_steps}
  network_path: ${base_policy_path}
  network:
    _target_: gentle_manip.dppo.pointnet_diffusion.PointNetDiffusionMLP
    action_dim: ${action_dim}
    horizon_steps: ${horizon_steps}
    cond_dim: ${eval:'${obs_dim} * ${cond_steps}'}
    pc_cond_steps: ${pc_cond_steps}
    visual_feature_dim: ${visual_feature_dim}
    category_embed_dim: ${category_embed_dim}
    time_dim: 16
    mlp_dims: [512, 512, 512]
    activation_type: ReLU
    residual_style: True
    pointnet:
      in_channels: 3
      use_layernorm: True
      final_norm: layernorm
  horizon_steps: ${horizon_steps}
  obs_dim: ${obs_dim}
  action_dim: ${action_dim}
  denoising_steps: ${denoising_steps}
  device: ${device}
