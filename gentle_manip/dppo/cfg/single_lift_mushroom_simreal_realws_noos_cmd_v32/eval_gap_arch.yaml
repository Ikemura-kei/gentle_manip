# [dppo-eval] ARM F: THEIR GAP codebase (BCPolicy + DeterministicMLP) on the CANONICAL harness.
# Forked from eval_diffusion_pointnet.yaml; the ONLY changes are _target_, the model: block,
# and cond_steps 2 -> 5 (their n_obs_steps). Same EvalSpec/venv/metrics as every other arm.
# [dppo cfg] v5 payoff run: 7d EULER absolute action (abs_pose_euler_abs_gripper, carries
# the euler_frame_offset_deg seam fix), rate-bounded + azimuth-bounded v5 demonstrations.
# Cloned from single_lift_mushroom_soft_abs_pcd_rot6d with obs_dim 10->8, action_dim 10->7.
# Dataset: dataset/dppo/single_lift_mushroom_soft_v7_7dc (convert_demos --derive-action).
# [dppo-eval] Evaluate the ABS-action PointNet diffusion policy (BC base or finetuned) on live sim.
# Used by: third_party/dppo/script/run.py (EvalHarnessAgent) via gentle_manip.dppo.train
# Status: experimental (DPPO step-2 eval: point-cloud student on the abs-action FEM-gentleness policy)
#
# Soft twin of single_lift_mushroom_soft_pcd/eval_diffusion_pointnet.yaml with action_dim=10 (abs) and
# the soft_abs paths. Routes through the SHARED canonical harness (gentle_manip.evaluation.run_eval):
# fixed EvalSpec (n_episodes=200, num_envs=5, deterministic per-batch DR seed) -> summary.json +
# episodes.csv + env-config snapshot + per-episode videos, into <base_policy_run>/eval/<datetime>/.
# scene_group_size>0 rebuilds geometry every K batches, so the server MUST be --subprocess:
#   serl_sim_server --experiment single_lift_mushroom_soft_abs_action_rot6d --view student \
#                   --num-envs 5 --render-rgb --subprocess --port 5570
# Run with envs/dppo.
defaults:
  - _self_
hydra:
  run:
    dir: ${logdir}
_target_: gentle_manip.dppo.gap_arch.eval_gap_arch.GapArchEvalAgent

name: ${env_name}_eval_gap_arch
logdir: ${eval_base:${base_policy_path}}/eval/${now:%Y-%m-%d}_${now:%H-%M-%S}
# base_policy_path is arm F's SNAPSHOT FILE (<run>/snapshot_N.pth): dppo_eval.sbatch's
# preflight requires a FILE, and eval_base returns p.parent for a non-'checkpoint' parent,
# which is exactly <run>. Do NOT set EVAL_SUBDIR for this config — the sbatch derives its
# subdir as dirname(dirname(CKPT)), which assumes <run>/checkpoint/state.pt and would write
# outside the run dir. Pass logdir=... in GM_EXTRA_OVERRIDES instead.
base_policy_path: ???        # set on CLI: the arm-F SNAPSHOT FILE (<run>/snapshot_100.pth)
normalization_path: ${oc.env:DPPO_DATA_DIR}/single_lift_mushroom_simreal_realws_noos_cmd_v32/normalization.npz
experiment: single_lift_mushroom_soft_abs_action_armfocus_7d_realws  # realws eval (policy trained on realws data; DEVLOG eval-protocol rule)

seed: 42
device: cuda:0
env_name: single_lift_mushroom_simreal_realws_noos_cmd_v32
obs_dim: 8                     # proprio only (ee_pos3 + ee_quat4 + gripper1); cloud is separate
action_dim: 7                 # abs pos3 + euler3 (frame-offset encoded) + gripper1
denoising_steps: 20
ft_denoising_steps: 0        # eval the base (BC) policy: no finetuned denoising steps
cond_steps: 5   # = their n_obs_steps; asserted in GapArchPolicy.act
pc_cond_steps: 1
n_points: 1024
visual_feature_dim: 512
horizon_steps: 4
act_steps: 4
use_ddim: False              # full 20-step denoising for an honest BC eval
ddim_steps: ${ft_denoising_steps}

# CANONICAL eval spec (shared across algorithms) — 200 episodes / 5 sub-envs = 40 batches.
n_episodes: 200
scene_group_size: 1          # REBUILD EVERY BATCH -> 40 batches = 40 DISTINCT GEOMETRIES.
                             # The width-slope rule needs >=40 distinct geometries (a 12-geo
                             # sample reversed three verdicts in this campaign). sgs=4 would
                             # give only 10. Matches lulkx's slope_* arms exactly (verified:
                             # 40 batches / 40 unique obj_scale in their episodes.csv).
record_batches: null         # null = record ALL batches, ALL envs -> one clip per episode
n_steps: 75
render_num: 5

env:
  n_envs: 5                  # MUST match serl_sim_server --num-envs
  name: ${env_name}
  env_type: genesis
  max_episode_steps: 300
  reset_at_iteration: False
  save_video: True
  use_image_obs: True
  best_reward_threshold_for_success: 0.2
  specific:
    obs_steps: ${cond_steps}
    act_steps: ${act_steps}
    normalization_path: ${normalization_path}
    port: 5570
    obs_keys: [ee_pos, ee_quat, gripper_width]   # quat proprio (obs_dim 8), matches the v5_7d dataset
    pointcloud_key: point_cloud

shape_meta:
  obs:
    state:
      shape: [10]
    point_cloud:
      shape: [1024, 3]
  action:
    shape: [10]

wandb: null

model:
  _target_: gentle_manip.dppo.gap_arch.eval_gap_arch.GapArchModel
  snapshot: ???        # set on CLI: <run>/snapshot_100.pth
  device: ${device}

