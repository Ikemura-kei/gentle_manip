# [dr] Full food DR: pose + orientation + size + procedural SHAPE deformation.
# Used by: experiments (dr:) — sim demo collection / training that varies object geometry
# Status: active
#
# Superset of sim_demo (pose + orientation + arm-home jitter) plus per-scene object SIZE and
# SHAPE randomization (real food varies in both). Size = uniform mesh scale; shape = mild
# near-diffeomorphic mesh deformation (bend = curvature, twist, taper) applied to the nominal
# mesh at scene build (gentle_manip/assets/mesh_deform.py). Size/shape are SCENE-level: one
# per sim launch (all sub-envs share the geometry); vary across launches, or rebuild every N
# episodes via SimBackend.randomize_scene() for within-run variety.
object_pos_xy: 0.08          # half-range (m): per-env object x/y jitter
robot_init_pos_xyz: 0.02     # half-range (m): per-env reset home EE xyz jitter
object_yaw_deg: 180          # per-env object yaw ~ U(-180,180) about world z (full range)
object_pitch_roll_deg: 15    # per-env object pitch & roll tilt ~ U(-15,15) deg

# ── per-scene size + shape (rebuild) ─────────────────────────────────────────
object_scale: [0.8, 1.2]     # uniform object scale
object_bend_deg: [-25, 25]   # total bend along the long axis (deg) — curvature (banana-like)
object_twist_deg: [-20, 20]  # total twist about the long axis (deg)
object_taper: [-0.15, 0.15]  # end-to-end thickness change (fraction)
# object_rbf: [0.0, 0.04]    # optional organic bumps (fraction of size); off by default
