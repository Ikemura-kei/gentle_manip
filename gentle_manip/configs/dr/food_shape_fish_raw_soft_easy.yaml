# [dr] TOY/EASY variant of food_shape for SOFT (MPM) fish_raw -- fragile-food
# 25-category campaign (2026-08-13). Mirrors food_shape_mushroom_soft_easy.yaml's
# narrow-DR recipe (validated: mushroom-soft-easy scored 75.0%, the best specialist
# result of the whole session). Material E/nu/rho band is narrowed around THIS
# object's own registered nominal (not mushroom's) -- 2.2e+04 Pa +/-7%.
# Used by: experiments (dr:) single_lift_fish_raw_soft_easy
# Status: experimental
object_pos_xy: 0.02
robot_init_pos_xyz: 0.01
object_yaw_deg: 180
# gentle_manip 25-category speed pass (2026-08-13): was 8 -- fish_raw's
# fillet mesh (size (0.07, 0.024, 0.0212), a thin flat slab) hit the SAME
# box-tipping-class bug as tofu/watermelon/cheese (grasp synthesis assumes
# the SAMPLED DR euler angle since MPMEntity has no get_quat() to query the
# true post-settle pose; a flat/thin object with nonzero spawn pitch/roll
# can settle into a meaningfully different orientation, desyncing every
# downstream coordinate-frame computation). Confirmed via frame-by-frame
# video inspection of collect_demos_synth_v2.py failure clips: the gripper
# closes cleanly on EMPTY SPACE next to the (untouched) object every time --
# not a width/reach issue, a pure position miss. 0/50 saved over 45 CMA-ES
# attempts (9 batches) before this fix, vs. e.g. chicken_breast (a
# ROTATIONALLY-SYMMETRIC capsule, unaffected by tipping since its silhouette
# doesn't change) succeeding on its very first batch with the SAME
# pitch_roll_deg: 8 -- the risk factor is asymmetric cross-section, not
# nonzero pitch/roll per se.
object_pitch_roll_deg: 0

object_scale:      [0.95, 1.05]
object_bend_deg:   [-2.0, 2.0]
object_twist_deg:  [-2.0, 2.0]
object_taper:      [-0.02, 0.02]
object_axis_scale: [0.97, 1.03]

object_E:  [2.046e+04, 2.354e+04]
object_nu: [0.388, 0.412]
object_rho: [1039, 1081]
coup_friction: [3.5, 4.5]
