# [dr] Per-category generalist eval DR: pool pinned to egg_boiled. EE init spans the
# home <-> near-object continuum (robot_init_offset_xyz mid-way + wide
# robot_init_pos_xyz) to MATCH the training sweep distribution -- no separate
# clean/arm-low split. Object pose DR mirrors xcat_diverse_regrasp.
# Used by: yd_reactive_eval.sbatch (adds a random mid-approach object kick) (CAT=egg_boiled)
# Status: experimental
object_pos_xy: 0.09
object_yaw_deg: 180
object_pitch_roll_deg: 14
robot_init_offset_xyz: [0.03, 0.0, -0.045]   # midpoint home(0.40,0,0.21) -> near-object hover
robot_init_pos_xyz: 0.065                    # +/- box spanning exact-home .. just-above-object
object_category_pool: ["egg_boiled"]
object_scale:      [0.88, 1.15]

# scene-level (rebuilt every scene_group -> every 5 eval episodes):
object_bend_deg:   [-4.0, 4.0]
object_twist_deg:  [-4.0, 4.0]
object_taper:      [-0.03, 0.03]
object_axis_scale: [0.92, 1.08]

# ── reactive perturbation: lateral velocity impulse to the object mid-approach ──
object_perturb_prob:  0.90          # 90%% of episodes get a kick (was 0.75 -- displacement too rare)
object_perturb_speed: [0.40, 0.95]  # per-frame speed x4 frames -> clearly-visible 6-18cm slide
object_perturb_frame: [56, 152]     # sim frames (policy step ~14-38): near the object, limited reaction time
