# [dr] Per-category generalist eval DR: pool pinned to tomato. EE init spans home <->
# near-object (matches training). Material varies per scene-group rebuild via the
# category's registry material_dr_mult (object_E/nu/rho left unset on purpose).
# Used by: yd_reactive_eval.sbatch (adds a random mid-approach object kick) (CAT=tomato); small object -> _small eval task.
# Status: experimental
object_pos_xy: 0.09
object_yaw_deg: 180
object_pitch_roll_deg: 14
robot_init_offset_xyz: [0.03, 0.0, -0.045]
robot_init_pos_xyz: 0.065
object_category_pool: ["tomato"]

# scene-level (rebuilt every scene_group = every 5 eval episodes): geometry only for
# the crude small meshes (bend/twist collapse them); material via registry mult.
object_scale: [0.90, 1.12]

# ── reactive perturbation: lateral velocity impulse to the object mid-approach ──
object_perturb_prob:  0.90          # 90%% of episodes get a kick (was 0.75 -- displacement too rare)
object_perturb_speed: [0.40, 0.95]  # per-frame speed x4 frames -> clearly-visible 6-18cm slide
object_perturb_frame: [56, 152]     # sim frames (policy step ~14-38): near the object, limited reaction time
