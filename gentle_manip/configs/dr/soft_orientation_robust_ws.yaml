# [dr] soft_orientation_robust + the REAL-WORKSPACE object range — iteration-2 COLLECTION DR.
# Used by: collect_demos_synth_v4 via single_lift_mushroom_soft_abs_action_robust_ws
# Status: active
#
# = robust arm-home start (±9cm) AND the real-workspace object range. Collection only.
object_pos_xy: 0.045
robot_init_pos_xyz: 0.09      # ±9cm per-axis arm-home jitter (soft_orientation: 0.02) — THE knob
object_yaw_deg: 180
object_pitch_roll_deg: 45
object_flip_prob: 0.25
object_flip_deg: [160, 180]

# ── per-scene SIZE + SHAPE (identical to soft_orientation) ───────────────────
object_scale:      [1.0, 1.5]
object_bend_deg:   [-25, 25]
object_twist_deg:  [-20, 20]
object_taper:      [-0.15, 0.15]
object_axis_scale: [0.95, 1.15]

# ── per-scene material (identical to soft_orientation) ───────────────────────
object_E: [2.0e5, 3.0e5]
object_nu: [0.32, 0.38]
object_rho: [900, 1100]
coup_friction: [3.5, 4.5]

# ── REAL-WORKSPACE object range (iteration 2, 2026-08-22) ────────────────────
# Absolute object range x [0.29, 0.48], y [-0.11, 0.11] (user-measured real reachable area),
# expressed as ASYMMETRIC offsets from the mushroom's nominal spawn (0.47, 0.0) — the nominal sits
# at the far EDGE of the x range, which no symmetric object_pos_xy half-range can express.
# Overrides object_pos_xy above.
# Symmetric about the RECENTRED nominal (0.385, 0) — the _ws task moves the spawn to the
# workspace centre, so [0.29,0.48]x[-0.11,0.11] becomes plain ± ranges.
object_dx_range: [-0.095, 0.095]
object_dy_range: [-0.11, 0.11]
