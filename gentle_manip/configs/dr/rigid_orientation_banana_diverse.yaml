# [dr] WIDE diverse-start pose DR for the rigid banana surrogate (OmniReset-inspired
# regrasp campaign, 2026-08-28). The bet: densely covering the object poses a robot
# could face AFTER a failed first grasp lets a BC policy trained on ONLY clean
# single-attempt successes recover on its own -- no explicit retry demos.
#
# Widened vs the standard narrow banana DR:
#   object_pos_xy    0.02 -> 0.08 m   (object bumped/rolled well away from nominal)
#   object_pitch_roll_deg 8 -> 14     (tilted after a fall; kept <= ~15 so a TOP-DOWN
#                                      parallel-jaw grasp stays geometrically feasible
#                                      -- the collector also clamps synth roll/pitch)
#   yaw stays full (180 = max half-range; banana is elongated, yaw is the key DOF)
#   robot_init_pos_xyz 0.01 -> 0.03   (arm-home jitter; the collector adds the LARGE
#                                      EE-start diversity on top via --start-modes)
# Shape/scale DR kept modest (same object, just repositioned). No MPM material DR
# (rigid has no particles / von Mises).
# Used by: experiments (dr:) single_lift_banana_rigid_diverse
# Status: experimental
object_pos_xy: 0.08
robot_init_pos_xyz: 0.03
object_yaw_deg: 180
object_pitch_roll_deg: 14

object_scale:      [0.78, 1.28]
object_bend_deg:   [-4.0, 4.0]
object_twist_deg:  [-4.0, 4.0]
object_taper:      [-0.03, 0.03]
object_axis_scale: [0.88, 1.12]
