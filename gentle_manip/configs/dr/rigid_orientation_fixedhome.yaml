# [dr] rigid_orientation with the ROBOT INIT POSE FIXED (arm-home jitter off).
# Used by: experiments (dr:) single_lift_mushroom_rigid_eval_fixedhome -> eval only
# Status: active
#
# Identical to rigid_orientation EXCEPT robot_init_pos_xyz 0.02 -> 0 (no per-env arm-home jitter).
# Motivation: the CMA-ES demo collection does NOT vary the robot's initial position, but the eval
# DR does (robot_init_pos_xyz=0.02) — a train/eval mismatch (the BC policy never saw a jittered
# start). This variant removes that one mismatch so we can measure its effect on success, while
# keeping the object pose/orientation DR (which DOES match collection: xy=0.04, pitch/roll 45, yaw).
object_pos_xy: 0.04           # unchanged — matches --xy-range 0.04 in data collection
robot_init_pos_xyz: 0.0       # <-- FIXED init gripper position (was 0.02); demos never vary it
object_yaw_deg: 180           # unchanged — full 360° yaw
object_pitch_roll_deg: 45     # unchanged — ±45° pitch & roll (matches collection)

# Per-scene SIZE + SHAPE DR (object geometry) — re-randomized per scene rebuild. In collection
# (collect_demos_synth.py --scene-dr-every) each rebuild deforms+scales the mushroom mesh; in eval
# the harness drives it deterministically per scene group. Recorded into priv_object_dr_params
# ([scale, bend_deg]). Ranges match configs/dr/food_shape.yaml (the earlier sim demo collection).
object_scale:      [1.0, 1.5]   # uniform object scale
object_bend_deg:   [-25, 25]     # curvature along the long axis (deg)
object_twist_deg:  [-20, 20]     # twist about the long axis (deg)
object_taper:      [-0.15, 0.15] # end-to-end thickness change (fraction)
object_axis_scale: [0.95, 1.15]    # anisotropic scale on ONE random x/y/z axis
