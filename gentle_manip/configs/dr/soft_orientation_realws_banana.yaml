# [dr] njhbz realws recipe for the BANANA (single mesh).
# Used by: experiments/single_lift_banana_soft_abs_action_armfocus.yaml
# Status: experimental
#
# scale capped at 1.0: the banana is 5.8 cm thick at scale 1.0 and the gripper opens 8.8 cm,
# so 1.5x (8.7 cm) would be ungraspable. Everything else matches soft_orientation_realws_mm4_s08.
object_pos_x: [0.29, 0.48]
object_pos_y: [-0.11, 0.11]
object_nominal_xy: [0.47, 0.0]
robot_init_pos_xyz: 0.02
object_yaw_deg: 180
object_pitch_roll_deg: 45
object_flip_prob: 0.25
object_flip_deg: [160, 180]
object_bend_deg:   [-25, 25]
object_twist_deg:  [-20, 20]
object_taper:      [-0.15, 0.15]
object_axis_scale: [0.95, 1.15]
object_scale:      [0.70, 1.00]
object_E: [2.0e5, 3.0e5]
object_nu: [0.32, 0.38]
object_rho: [900, 1000]
coup_friction: [3.5, 4.5]
