# [dr] WIDE-POSE variant of food_shape_banana_soft_easy.yaml, for the OmniReset-
# inspired diverse-start demo collection (2026-08-27): object_pos_xy widened
# 0.02->0.07m (3.5x) and object_pitch_roll_deg widened 8->15deg, to represent the
# object having been lifted a bit, dropped, and bumped/rolled away from its
# original spot after a failed grasp attempt -- not just the narrow "as originally
# placed" jitter the standard config models. yaw stays full (180 = already the max
# half-range). Material/shape DR unchanged (same object, just possibly repositioned).
# Used by: grasp_synthesis/collect_demos_diverse_start.py (single_lift_banana_soft_easy_retry2)
# Status: experimental
object_pos_xy: 0.07
robot_init_pos_xyz: 0.01
object_yaw_deg: 180
object_pitch_roll_deg: 15

object_scale:      [0.95, 1.05]
object_bend_deg:   [-2.0, 2.0]
object_twist_deg:  [-2.0, 2.0]
object_taper:      [-0.02, 0.02]
object_axis_scale: [0.97, 1.03]

object_E:  [2.79e+05, 3.21e+05]
object_nu: [0.339, 0.36]
object_rho: [960.4, 999.6]
coup_friction: [3.5, 4.5]
