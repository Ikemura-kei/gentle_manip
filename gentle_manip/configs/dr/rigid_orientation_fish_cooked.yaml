# [dr] Per-reset DR for rigid fish_cooked lift -- pose + full orientation + this
# category's own shape/scale ranges (mirrors registry.py ObjectDef.shape_dr_ranges
# for fish_cooked -- slightly less flexible/bendy than raw, per the registry note).
# Used by: experiments (dr:) single_lift_fish_cooked_rigid
# Status: active
object_pos_xy: 0.04           # half-range (m)
robot_init_pos_xyz: 0.02      # per-env arm-home jitter
object_yaw_deg: 180           # full 360 deg yaw
object_pitch_roll_deg: 45     # +/-45 deg pitch & roll

object_scale:      [0.8, 1.2]
object_bend_deg:   [-8.0, 8.0]
object_twist_deg:  [-6.0, 6.0]
object_taper:      [-0.1, 0.1]
object_rbf:        [0.0, 0.02]
object_axis_scale: [0.9, 1.1]
