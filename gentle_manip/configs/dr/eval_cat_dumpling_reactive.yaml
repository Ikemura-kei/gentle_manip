# [dr] Per-category generalist eval DR (OOD): pool pinned to dumpling. EE init spans
# home <-> near-object (matches training). Used by: yd_gen_eval.sbatch (CAT=dumpling)
# Status: experimental
object_pos_xy: 0.09
object_yaw_deg: 180
object_pitch_roll_deg: 14
robot_init_offset_xyz: [0.03, 0.0, -0.045]
robot_init_pos_xyz: 0.065
object_category_pool: ["dumpling"]
object_scale:      [0.90, 1.12]

# scene-level (rebuilt every scene_group -> every 5 eval episodes):
object_bend_deg:   [-4.0, 4.0]
object_twist_deg:  [-4.0, 4.0]
object_taper:      [-0.03, 0.03]
object_axis_scale: [0.92, 1.08]

# ── reactive perturbation: lateral velocity impulse to the object mid-approach ──
object_perturb_prob:  0.75          # 75%% of episodes get a kick; 25%% stay clean
object_perturb_speed: [0.30, 0.85]  # per-frame speed, sustained 4 frames -> ~5-15cm slide
object_perturb_frame: [56, 152]     # sim frames (policy step ~14-38): near the object, limited reaction time
