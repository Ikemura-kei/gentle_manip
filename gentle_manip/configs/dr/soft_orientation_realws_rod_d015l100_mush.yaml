# [dr] rod_d015l100_mush (lying 15x100 mm rod): realws pose DR (SHARED with every object) + this object's shape/size/material ranges.
# Used by: experiments/single_lift_rod_d015l100_mush_soft_abs_action_armfocus_7d_realws.yaml
# Status: active (2026-09-04 per-object cleanup: shared block = soft_orientation_realws_tofu.yaml)

# ── SHARED, EXCEPT the orientation block below ──
# Orientation is OBJECT-SPECIFIC here (2026-09-09): these meshes were authored in a
# deliberate resting pose (cans on the curved surface vs standing, donut hole up), so
# pitch/roll tilt and the 180-degree flip are OFF and only yaw varies, +/-80 degrees.
object_pos_x: [0.38, 0.45]     # long object under yaw DR: same tight box as the can
object_pos_y: [-0.09, 0.09]    # long object under yaw DR: same tight box as the can
object_nominal_xy: [0.47, 0.0]
robot_init_pos_xyz: 0.02
object_yaw_deg: 80
object_pitch_roll_deg: 0
object_flip_prob: 0
object_flip_deg: [160, 180]
coup_friction: [3.5, 4.5]

# ── OBJECT-SPECIFIC ──
object_scale: [0.8, 1.0]      # user, 2026-09-10 (80-100 mm long, 12-15 mm dia)
                              # max x 0.545 vs the padded edge 0.548. The first scene build
                              # edge is x=0.548, leaving 78 mm for the can's 85 mm half-length,
object_axis_scale: [1.0, 1.0]   # no axis randomisation on the rod (keeps it a true cylinder)
object_bend_deg: [-3, 3]
object_twist_deg: [-3, 3]
object_taper: [-0.03, 0.03]
object_E: [2.0e5, 3.0e5]
object_nu: [0.32, 0.38]
object_rho: [900, 1000]
start_modes: {home: 0.6, in_air: 0.15, above_object: 0.15, mid_approach: 0.1}
disturbance_prob: 0.1
