# [dr] Cross-category SMALL-object diverse-start REGRASP DR: draws one of the 4
# small soft fruit (1.5-2.0 cm) each scene. SCALE-ONLY shape DR -- bend/twist/taper
# on a ~2 cm crude mesh produces degenerate geometry that crashes the CMA-ES SDF
# BVH build (the mesh-validity guard in the collector catches it but wastes a batch).
# Used by: experiments (dr:) single_lift_xcat_small_diverse / _eval
# Status: experimental
object_pos_xy: 0.07
object_yaw_deg: 180
object_pitch_roll_deg: 12
robot_init_pos_xyz: 0.025

object_category_pool: ["grape", "cherry", "tomato", "raspberry"]

object_scale:      [0.90, 1.15]
