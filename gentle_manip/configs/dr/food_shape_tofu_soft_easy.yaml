# [dr] TOY/EASY variant of food_shape for SOFT (MPM) tofu -- fragile-food
# 25-category campaign (2026-08-13). Mirrors food_shape_mushroom_soft_easy.yaml's
# narrow-DR recipe (validated: mushroom-soft-easy scored 75.0%, the best specialist
# result of the whole session). Material E/nu/rho band is narrowed around THIS
# object's own registered nominal (not mushroom's) -- 5.67e+04 Pa +/-7%.
# Used by: experiments (dr:) single_lift_tofu_soft_easy
# Status: experimental
object_pos_xy: 0.02
robot_init_pos_xyz: 0.01
object_yaw_deg: 180
# pitch/roll forced to 0 (2026-08-13 fix): a BOX primitive can TIP onto a
# different face during MPM settling under nonzero pitch/roll DR, but the
# grasp-synthesis code's assumed object orientation (obj_quat_all, derived
# from the SAMPLED euler, not the true post-settle pose -- MPMEntity has no
# get_quat() to query the real one) then silently mismatches the box's
# actual resting orientation, corrupting the CMA-ES coordinate frame and
# causing every grasp attempt to miss (confirmed via video + 100+ zero-
# success attempts for tofu at otherwise-proven-good settings; a mesh-based
# object of similar size/material succeeded on its very first batch,
# isolating this to box-tipping specifically). Yaw is still randomized
# (rotation about the up axis doesn't change which face rests down).
object_pitch_roll_deg: 0

object_scale:      [0.95, 1.05]
object_bend_deg:   [-2.0, 2.0]
object_twist_deg:  [-2.0, 2.0]
object_taper:      [-0.02, 0.02]
object_axis_scale: [0.97, 1.03]

object_E:  [5.273e+04, 6.067e+04]
object_nu: [0.291, 0.309]
object_rho: [1029, 1071]
coup_friction: [3.5, 4.5]
