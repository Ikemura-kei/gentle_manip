# [dr] TOY/EASY variant of rigid_orientation_egg -- sixth category on the task-
# difficulty spectrum, a smooth elongated ellipsoid (single-axis-dominant shape),
# structurally different from every round fruit AND from mushroom's cap+stem
# topology. Per the user's direction (2026-08-11): category DIVERSITY matters, not
# just count. No gripper-margin flag in egg's own DR history (full 45deg pitch/roll).
# Used by: experiments (dr:) single_lift_egg_rigid_easy
# Status: experimental
#
# Narrowed the same way as every other _easy variant: pos half-range 0.04->0.02,
# pitch/roll 45->8deg, yaw kept full, scale/shape DR reduced near zero.
object_pos_xy: 0.02
robot_init_pos_xyz: 0.01
object_yaw_deg: 180
object_pitch_roll_deg: 8

object_scale:      [0.95, 1.05]
object_bend_deg:   [-2.0, 2.0]
object_twist_deg:  [-2.0, 2.0]
object_taper:      [-0.02, 0.02]
object_axis_scale: [0.97, 1.03]
