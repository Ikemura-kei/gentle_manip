# [obs] SUPERSET obs for RIGID objects — full privileged state + point cloud + contact force.
# Used by: demo collection (--experiment) when sanity-checking the rigid-body contact-force
#          observation (priv_contact_force) alongside a state-based policy's other fields
# Status: experimental
#
# Forked from superset_rigid_full_state.yaml, adding privileged.contact_force: true — a
# rigid-body grip-force surrogate (sum of gripper-object contact-force magnitudes, Newtons;
# see PrivilegedConfig.contact_force / genesis_worker._gripper_object_contact_force). This is
# the rigid analogue of the soft-body priv_stress field.
#
# Privileged state vector (flat, for DPPO training with STATE_VIEW_FULL + contact force):
#   ee_pos(3) + ee_quat(4) + gripper_width(1) +
#   priv_object_pos(3) + priv_object_rot6d(6) + priv_object_dr_params(2) +
#   priv_contact_force(1)  =  20 dims
include_joint_pos: false
include_joint_vel: false
quat_noise_std: 0.003

privileged:
  object_pos: true
  object_rot6d: true         # object orientation as 6D (Zhou et al. 2019) — continuous,
                             # singularity-free; better than quat for wide rotation ranges
  object_dr_params: true     # [scale, bend_deg] — episode constant; 0.0/1.0 when no shape DR
  stress: false              # rigid → no von Mises
  contact_force: true        # sum of gripper-object contact force magnitudes (N) — grip-force
                             # surrogate; the thing under sanity-check in this experiment

# Point cloud retained for future student training on the same demos.
point_cloud:
  cameras: ["cam_ext"]
  crop_min: [0.2, -0.215, 0.004]
  crop_max: [0.71,   0.215,  0.45]
  max_points: 1024
  outlier_removal:
    voxel_size: 0.01
    min_neighbors: 23
