# [experiment] SMALL-object OOD eval twin (dr: soft_orientation_ood_small). Item 7.
# Used by: Part B (arm-focus 7d absolute) of docs/cluster_experiment_action_space_ablation.md — collect + eval
# Status: experimental (action-space ablation, sim arm-focus arm)
#
# IDENTICAL to single_lift_mushroom_soft_abs_action_armfocus EXCEPT the action is abs_pose_euler_abs_gripper
# (7d: 3 pos + 3 euler + 1 grip) instead of abs_pose_abs_gripper (10d rot6d). The eval sim server derives
# its ActionPipeline from this action, so the 7d arm-focus ABS policy must be evaluated with THIS experiment.
task: single_lift_mushroom_soft_ood   # raised spawn z for OOD scale
action: abs_pose_euler_abs_gripper
dr: soft_orientation_ood_small   # small-object OOD eval (item 7)
augmentation: l515_noise

obs: superset_soft_armfocus
views:
  teacher: [privileged]
  student: [point_cloud]

rl:
  discount: 0.99
  random_steps: 300
  training_starts: 5000
  batch_size: 256
  max_episode_steps: 400
