# [experiment] SOFT mushroom lift, NO STRESS PENALTY — success-only ablation.
# Used by: serl_sim_server.py (--experiment) + DPPO finetune (experiment snapshot)
# Status: experimental (2026-07-05)
#
# Same as single_lift_mushroom_soft in every way (action / DR / augmentation / obs / views / rl)
# EXCEPT task -> single_lift_mushroom_soft_nostress (drops the stress reward). Lets us finetune
# for pure success (isolate learning difficulty) while eval still measures von-Mises stress.
task: single_lift_mushroom_soft_nostress        # dist_to_obj + lift + success only (no stress)
action: delta_pose_delta_gripper
dr: food_shape                      # same FULL DR as the gentle experiment
augmentation: l515_noise
obs: superset_soft
views:
  teacher: [privileged]
  student: [point_cloud]
rl:
  random_steps: 200
  training_starts: 400
  batch_size: 256
  discount: 0.92
  utd_ratio: 2
  critic_lr: 1.0e-4
