# [experiment] SOFT mushroom lift — BOOSTED success/lift + stress.scale=0.1. Same composition
#              as single_lift_mushroom_soft except task -> the boosted-reward variant.
# Used by: serl_sim_server.py (--experiment) + DPPO finetune (experiment snapshot)
# Status: experimental (2026-07-13)
#
# pundd-based reward-shaping sweep: success_scale 2.0, lift 0.2, stress 0.1. Tests whether a
# stronger success/lift incentive lets a given stress penalty stay gentle WITHOUT collapsing success.
task: single_lift_mushroom_soft_boost_ss0p1
action: delta_pose_delta_gripper
dr: food_shape
augmentation: l515_noise
obs: superset_soft
views:
  teacher: [privileged]
  student: [point_cloud]
rl:
  random_steps: 200
  training_starts: 400
  batch_size: 256
  discount: 0.92
  utd_ratio: 2
  critic_lr: 1.0e-4
