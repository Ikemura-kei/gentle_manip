# [experiment] State-based RIGID mushroom lift, absolute-pose action, + contact-force sanity check.
# Used by: collect_demos_synth.py --experiment (contact-force observation trend validation)
# Status: experimental
#
# Forked from single_lift_mushroom_rigid_state_abs_action.yaml, swapping the obs config to
# superset_rigid_full_state_force (adds privileged.contact_force — a rigid-body grip-force
# surrogate, sum of gripper-object contact-force magnitudes in Newtons). Everything else
# (task/action/dr/augmentation/views) is unchanged. Collect a handful of episodes with this
# experiment and plot priv_contact_force(t) alongside gripper_width(t) to check the signal is
# sane in trend (near-zero during approach, ramps during grasp-close, roughly steady during
# lift/hold).
task: single_lift_mushroom_rigid
action: abs_pose_abs_gripper
dr: rigid_orientation         # ±45° pitch/roll, full yaw, xy=0.04 — matches data collection
augmentation: l515_noise

obs: superset_rigid_full_state_force  # + privileged.contact_force vs the non-force experiment
views:
  teacher: [privileged]         # state-only training view: all priv_* fields, no point cloud
  student: [point_cloud]        # future student: ee_pos + ee_quat + gripper + point_cloud

rl:
  discount: 0.99
  random_steps: 300
  training_starts: 5000
  batch_size: 256
  max_episode_steps: 400
