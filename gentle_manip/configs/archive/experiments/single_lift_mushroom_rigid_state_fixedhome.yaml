# [experiment] State-based policy experiment for RIGID mushroom lift, robot init pose FIXED.
# Used by: dppo eval (eval_diffusion_mlp.yaml experiment:) / serl_sim_server --experiment
# Status: active
#
# Same as single_lift_mushroom_rigid_state.yaml but dr: rigid_orientation_fixedhome (robot
# init pose NOT randomized, matching the CMA-ES demo collection, which never varies it). Everything
# else identical. Probes the train/eval init-pose mismatch for the state-only (no point cloud) policy.
task: single_lift_mushroom_rigid
action: delta_pose_delta_gripper_fast_rot
dr: rigid_orientation_fixedhome  # FIXED init gripper pos (robot_init_pos_xyz=0); demos never vary it
augmentation: l515_noise

obs: superset_rigid_full_state  # privileged full state (rot6d + dr_params) + point cloud
views:
  teacher: [privileged]         # state-only training view: all priv_* fields, no point cloud
  student: [point_cloud]        # future student: ee_pos + ee_quat + gripper + point_cloud

rl:                              # mirrors single_lift_mushroom_rigid_state.yaml (unused at eval time)
  discount: 0.99
  random_steps: 300
  training_starts: 5000
  batch_size: 256
  max_episode_steps: 400
