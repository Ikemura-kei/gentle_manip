# [experiment] CANONICAL EVALUATION experiment — the fixed reference sim (235/250) for ALL policy
#              evals. Same composition as single_lift_mushroom_soft except task -> the pinned eval task.
# Used by: dppo_eval.sbatch (DEFAULT SIM_EXPERIMENT + EVAL_EXPERIMENT) / serl_sim_server --experiment
# Status: active (2026-07-15)
#
# Every policy (nostress, stress, boosted, coarse-trained, ...) is evaluated through THIS experiment
# so success + stress are apples-to-apple. Only the policy-specific ft_denoising_steps (0=BC, 10=
# finetuned) and the checkpoint vary per eval; the SIM never does.
task: single_lift_mushroom_soft_eval
action: delta_pose_delta_gripper
dr: food_shape
augmentation: l515_noise
obs: superset_soft
views:
  teacher: [privileged]
  student: [point_cloud]
rl:
  random_steps: 200
  training_starts: 400
  batch_size: 256
  discount: 0.92
  utd_ratio: 2
  critic_lr: 1.0e-4
