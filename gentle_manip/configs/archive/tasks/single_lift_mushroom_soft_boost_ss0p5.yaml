# [task] Soft-MPM mushroom lift — BOOSTED success/lift + stress-scale sweep (stress.scale=0.5).
# Used by: experiments/single_lift_mushroom_soft_boost_ss0p5 -> DPPO finetune
# Status: experimental (2026-07-13)
#
# Same as single_lift_mushroom_soft EXCEPT three reward weights, to offset the stress penalty's
# per-step duration-coupling that was suppressing grasps (pundd family): success_scale 0.2->2.0
# (10x), lift.scale 0.1->0.2 (2x), and stress.scale=0.5. Everything else (success band, dist
# shaping, sim dynamics, stress cap/weights) matches the base soft task.
success_z_min: 0.175
success_z_max: 0.275          # widened from 0.225 — see single_lift_mushroom_rigid.yaml note
hold_steps: 30
object_name: "mushroom"
object_type: "soft"      # MPM -> von_mises_stress for the stress reward
sim_substeps: 220        # GM_SIM_SUBSTEPS overrides at launch (runs use 235, matching pundd)
mpm_grid_density: 250
success_scale: 2.0       # BOOSTED (was 0.2)

rewards:
  stress:
    scale: 0.5         # swept: 0.5 / 0.2 / 0.1 / 0.05
    cap: 1.5
    mean_weight: 0.2
    top10_weight: 0.8
  dist_to_obj:
    scale: 0.1
    decay: 8.0
  lift:
    scale: 0.2           # BOOSTED (was 0.1)
    grasp_gate_dist: 0.079
    lift_target: 0.16
