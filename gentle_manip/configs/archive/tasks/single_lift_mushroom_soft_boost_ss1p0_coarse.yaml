# [task] Soft-MPM mushroom lift — COARSE sim speed/stability probe (substeps=98, grid_density=105).
# Used by: experiments/single_lift_mushroom_soft_boost_ss1p0_coarse -> DPPO finetune
# Status: experimental (2026-07-15)
#
# IDENTICAL to single_lift_mushroom_soft_boost_ss0p5 (success_scale 2.0, lift.scale 0.2,
# stress.scale 0.5) EXCEPT a much COARSER MPM sim: sim_substeps 220->98 and mpm_grid_density
# 250->105. MPM cost ~ grid_density^4, so this is a large speedup; the probe is whether the
# grasp stays stable (no NaN) and how fast it runs. GM_SIM_SUBSTEPS also set to 98 at launch.
success_z_min: 0.175
success_z_max: 0.225
hold_steps: 30
object_name: "mushroom"
object_type: "soft"      # MPM -> von_mises_stress for the stress reward
sim_substeps: 98         # COARSE (was 220); GM_SIM_SUBSTEPS=98 also set at launch
mpm_grid_density: 105    # COARSE (was 250) — no env override, so it lives here
# At grid_density 105 the MPM domain's inward safety padding (~1-3 cells, cell=1/105~=0.0095 m)
# lifts the padded floor to ~0.0086 m, ABOVE the mushroom's default resting bottom (~0.0027 m) ->
# "particles outside solver boundary" build crash. Raise the spawn so it clears the padded floor.
object_spawn_z: 0.05     # spawn height (m); default registry z is 0.016
success_scale: 2.0       # boosted (same as boost_ss0p5)

rewards:
  stress:
    scale: 1.0
    cap: 1.5
    mean_weight: 0.2
    top10_weight: 0.8
  dist_to_obj:
    scale: 0.1
    decay: 8.0
  lift:
    scale: 0.2           # boosted (same as boost_ss0p5)
    grasp_gate_dist: 0.079
    lift_target: 0.16
