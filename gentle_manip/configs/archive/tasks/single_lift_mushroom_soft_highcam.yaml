# [task] Camera-placement STUDY fork of single_lift_mushroom_soft.yaml — ONLY the cam_ext (depth ->
# point cloud) extrinsic changes; object/reward/success/sim dynamics are identical.
# Used by: experiments (task:) single_lift_mushroom_soft_abs_action_highcam -> v3 demo collection (viz)
# Status: experimental (investigation: does a higher, more top-down depth view give better object
# size/shape info in the point cloud?)
#
# cam_ext raised +15cm in z from the calibrated L515 pose and re-aimed at the object-pose
# randomization CENTER (mushroom default xy = 0.47, 0.0) at z=0 -> a more top-down profile.
#   default pos    (0.98910661, -0.00034108, 0.09825304) -> +0.15 z
#   default lookat (-0.01056659, 0.0207823,  0.11265116) -> object DR center (0.47, 0, 0)
cam_pos:    [0.98910661, -0.00034108, 0.24825304]
cam_lookat: [0.47, 0.0, 0.0]

# ── everything below is identical to single_lift_mushroom_soft.yaml ──
success_z_min: 0.175
success_z_max: 0.275
hold_steps: 30
object_name: "mushroom"
object_type: "soft"

sim_substeps: 220
mpm_grid_density: 250

success_scale: 0.2

rewards:
  stress:
    scale: 0.2
    cap: 1.5
    mean_weight: 0.2
    top10_weight: 0.8
  dist_to_obj:
    scale: 0.1
    decay: 8.0
  lift:
    scale: 0.1
    grasp_gate_dist: 0.079
    lift_target: 0.16
