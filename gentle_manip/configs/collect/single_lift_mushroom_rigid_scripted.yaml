# Automatic scripted demo collection for the RIGID mushroom. SERL recommends ~20 demos.
# Records the SUPERSET obs (no stress) + reward at the rigid task's scale, so demos match
# the training env exactly (no rescale needed).
experiment: single_lift_mushroom_rigid
task_name: single_lift_mushroom_rigid
out_dir: dataset/demos

input: scripted
show_viewer: false
n_episodes: 20               # SERL's recommended demo count
rate: 30
speed: 0.5
gripper_value: 0.5           # matches the 0.005 gripper action scale
settle_steps: 60             # let the rigid mushroom finish rolling/settling before grasp

scripted:
  lift_height: 0.2
  hold_seconds: 2.0
  approach_height: 0.12
  # grasp_z sweep (instrumented, 3 trials each): 0.004/0.008/0.012 -> 3/3 lifts, 0.016 -> 1/3,
  # 0.020 -> 0 (the fingertip TCP's pads sit above the tip, so too high overshoots the body).
  # 0.010 is safely mid-range. Fingers pinch the narrow lower body to gw~0.02 and lift fine.
  grasp_z: 0.010
  grasp_gw: 0.035
  grasp_firm_steps: 4

record_video: true
video_episodes: 5
video_failed_episodes: 5     # also save the first 5 FAILED grasps (ep_FAILED_NNN.mp4) to diagnose
video_fps: 30

idle_threshold: 0.001
keep_trailing_idle: 5
max_interior_idle: 3
action_noise_std: 0.0
