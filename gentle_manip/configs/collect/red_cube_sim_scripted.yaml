# Scripted (automatic) sim demo collection for the red-cube lift task — drives
# examples/collect_demos_sim.py with input=scripted: no teleop, runs headless, and
# produces the same (obs, action) schema a human teleoperator would.
task_name: red_cube_sim
object: red_cube
object_type: rigid              # "rigid" | "soft"

# ── sub-configs (names; null to skip the optional ones) ──────────────────────
obs_config: point_cloud_1cam
action_config: delta_pose_delta_gripper
dr: sim_demo                    # reset jitter: cube + arm pose
augmentation: l515_noise        # sim point-cloud noise toward the real L515

# ── output ───────────────────────────────────────────────────────────────────
out_dir: dataset/demos

# ── collection mode ──────────────────────────────────────────────────────────
input: scripted                 # keyboard (human) | scripted (automatic)
n_episodes: 50                  # scripted: number of demos to collect
show_viewer: false              # scripted runs headless by default; true to watch
record_video: true              # save cam_ext RGB mp4 for the first video_episodes (quality check)
video_episodes: 5               # how many episodes to record (-> <run_dir>/videos/ep_NNN.mp4)
video_fps: 30

# ── loop / motion ────────────────────────────────────────────────────────────
rate: 30.0                      # control rate (Hz); also sets the hold duration in steps
speed: 0.5                      # scripted: per-step pose speed cap (normalized action)
gripper_value: 0.05             # scripted: gripper close delta
settle_steps: 40
action_noise_std: 0.01          # Gaussian noise (norm. action units) on POSE deltas only

# ── scripted state machine (the task: lift to lift_height, hold hold_seconds) ──
scripted:
  lift_height: 0.2              # m: lift the cube to this height, then hold
  hold_seconds: 2.0            # s: hold at height
  approach_height: 0.12        # m above the cube for the pre-grasp
  grasp_z: 0.006               # m: fingertip TCP z at the grasp (near the table)
  grasp_gw: 0.030              # m: gripper width treated as 'in contact'
  grasp_firm_steps: 1          # extra close steps past contact (more = firmer/lower gw)

# ── idle trim (at save time) ─────────────────────────────────────────────────
idle_threshold: 0.001
keep_trailing_idle: 30
max_interior_idle: 3
