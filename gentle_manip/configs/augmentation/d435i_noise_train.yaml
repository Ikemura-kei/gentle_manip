# [augmentation] TRAIN-TIME cloud augmentation = d435i_noise (measured sensor noise) + leaked table residue.
# Used by: the DPPO training cfg (model.pc_aug) / train_dppo_dp3.sh PC_AUG; and, explicitly, robustness evals
#          (serl_sim_server --augmentation d435i_noise_train). NOT the rollout/eval default (that is d435i_noise).
# Status: active
pc_axial_coeff: 0.002
pc_axial_cam_pos: [0.78032539, -0.00362529, 0.28947945]

# Lateral (pixel-footprint) error, ~0.24 mm at 0.5 m — an order below axial. Kept small but ON:
# it is what stops the sim cloud lying on a geometrically perfect surface.
pc_lateral_coeff: 0.0005

# Missing returns. The real frame is 9.8% invalid pixels; after crop + FPS the surviving cloud is
# denser than that implies, so this is deliberately modest rather than 0.098.
pc_dropout: 0.03

# Leaked table residue (2026-09-06): tiny flat clusters just above the board, as measured on a real deploy
# (tzdhk_2000 ep0: 1-12 pts, median 3; 1-4 mm thick; 4-13 mm across; 19-29 mm high; 1-3 per frame in 34 %
# of frames). The real pipeline's ground_residual filter removes most of them; this makes the policy
# indifferent to the rest (5 such points moved the gripper command 4-7 mm toward open). Sim-only.
pc_residue_prob: 0.5
pc_residue_clusters: [1, 3]
pc_residue_points: [1, 8]      # measured median 3 / max 12; merged neighbours give the tail
pc_residue_z: [0.019, 0.032]
pc_residue_extent: [0.004, 0.015]
pc_residue_thickness: 0.003

seed: 0
