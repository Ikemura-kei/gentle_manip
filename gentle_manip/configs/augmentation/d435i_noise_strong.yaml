# [augmentation] STRONG cloud perturbation — the second view of the clean-vs-perturbed encoder consistency
# term (PairedRegDiffusionModel.consistency_*), 2026-09-06. Deliberately harsher than d435i_noise.yaml (the BC
# augmentation): the encoder is asked to be flat over a wider neighbourhood while the policy head still learns
# from realistic clouds. Every entry is LABEL-PRESERVING (the demonstrated action does not change under it).
# Used by: gentle_manip.dppo.paired_reg_diffusion (model.consistency_aug); never by a rollout.
# Status: active
pc_axial_coeff: 0.003            # 1.5x the measured stereo noise
pc_axial_cam_pos: [0.78032539, -0.00362529, 0.28947945]
pc_lateral_coeff: 0.0015
pc_dropout: 0.10                 # scattered misses (measured real frame: 9.8 % invalid)
pc_patch_prob: 1.0               # one occlusion blob, radius 0.5-1 cm, ONLY above 10 cm (arm body) — never the object
pc_patch_radius: [0.005, 0.01]
pc_patch_z_min: 0.10
pc_residue_prob: 1.0             # leaked table residue on EVERY perturbed view
pc_residue_clusters: [1, 5]
pc_residue_points: [1, 12]
pc_residue_z: [0.019, 0.035]
pc_residue_extent: [0.004, 0.015]
pc_residue_thickness: 0.003
seed: 0
