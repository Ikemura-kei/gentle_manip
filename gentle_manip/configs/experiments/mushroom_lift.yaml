# Experiment = single source of truth for the mushroom-lift task across all stages.
# Data collection records the SUPERSET obs (configs/obs/mushroom_superset.yaml); training
# / online interaction use a VIEW (a subset of the superset, params inherited so it can't
# drift). New tasks = a new file like this; no new training code.
task: mushroom_lift                 # object + reward (yield-normalized stress) + dynamics
action: delta_pose_delta_gripper
dr: sim_demo                        # reset jitter (cube/arm)
augmentation: l515_noise            # sim-only obs augmentation

obs: mushroom_superset              # SUPERSET (collection). Views subview() it:
views:
  teacher: [privileged]             # state + privileged (object pose/vel + normalized stress); no render
  student: [point_cloud]            # state + denoised point cloud (deployable); render on
  # ablations, same demos: e.g. teacher_no_stress would be a view listing privileged-minus-stress

# SAC/RLPD hyperparams (train_serl.py reads these over its defaults).
rl:
  random_steps: 200                 # actor: uniform-random exploration before the policy
  training_starts: 400              # learner: online transitions before gradient steps begin
  batch_size: 256
  discount: 0.92                     # was 0.97: lower the Q-ceiling (r/(1-γ)) ~3x to curb
                                      # SAC overestimation, with reward ×0.1 (task config)
  # Stability tune (2026-07-02): the UTD gate + grad-clip only SLOWED the Q-overestimation
  # (critic_loss crept 50->460, Q hit ~1150 >> the ~130 return ceiling). Halve the update
  # ratio and slow the critic to curb the bootstrap blow-up.
  utd_ratio: 2                      # was 4 (grad steps per online transition)
  critic_lr: 1.0e-4                 # was 3e-4
