# [experiment] single_lift_tofu_soft_abs_action_armfocus_7d_realws: the 3cm TOFU BLOCK twin of single_lift_mushroom_soft_abs_action_armfocus_7d_realws.
# Used by: v3 synth collection + DPPO training/eval (pure sim, no real data)
# Status: experimental (second object category)
#
# IDENTICAL to single_lift_mushroom_soft_abs_action_armfocus EXCEPT the action is abs_pose_euler_abs_gripper
# (7d: 3 pos + 3 euler + 1 grip) instead of abs_pose_abs_gripper (10d rot6d). The eval sim server derives
# its ActionPipeline from this action, so the 7d arm-focus ABS policy must be evaluated with THIS experiment.
task: single_lift_tofu_soft
action: abs_pose_euler_abs_gripper
dr: soft_orientation_realws   # REAL-workspace object spawn box (x 0.29-0.48, y ±0.11)
augmentation: l515_noise

obs: superset_soft_armfocus
views:
  teacher: [privileged]
  student: [point_cloud]

rl:
  discount: 0.99
  random_steps: 300
  training_starts: 5000
  batch_size: 256
  max_episode_steps: 400
