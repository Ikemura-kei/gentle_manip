# [experiment] TOY/EASY rigid avocado lift -- second confirmation of the
# apple-easy toy-task finding (see rigid_orientation_avocado_easy.yaml and
# docs/cross_category_specialist_log.md). Same pipeline/architecture as every
# cherry specialist and apple-easy, on avocado (~95mm long axis) with narrow
# pose/shape DR.
# Used by: grasp_synthesis collect_demos_synth_v2/v3.py; DPPO train/eval
# Status: experimental
task: single_lift_avocado_rigid
action: delta_pose_delta_gripper_fast_rot
dr: rigid_orientation_avocado_easy
augmentation: l515_noise

obs: superset_rigid
views:
  teacher: [privileged]
  student: [point_cloud]

rl:
  discount: 0.99
  random_steps: 300
  training_starts: 5000
  batch_size: 256
  max_episode_steps: 400
