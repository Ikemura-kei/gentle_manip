# [experiment] SOFT mushroom lift, abs action — soft twin of single_lift_mushroom_rigid_abs_action.yaml
# Used by: collect_demos_synth_v3 (FEM-gentleness grasp collection on the SOFT sim)
# Status: active
#
# Same composition as the RIGID abs-action experiment (abs action, rigid_orientation pose DR, views, rl)
# but the task is the canonical SOFT MPM mushroom (single_lift_mushroom_soft, substep 220, Config C
# material) — so the ONLY difference from rigid collection is soft vs rigid physics, and the output
# folder is dataset/demos/single_lift_mushroom_soft/ (task name, per the naming convention).
task: single_lift_mushroom_soft      # existing soft task (soft MPM, ~230 substeps)
action: abs_pose_abs_gripper
dr: rigid_orientation                # ±45° pitch/roll, full yaw — same pose DR as the rigid experiment
augmentation: l515_noise

obs: superset_soft                   # soft superset (privileged incl. von Mises stress) + point_cloud
views:
  teacher: [privileged]
  student: [point_cloud]

rl:                                  # mirrors the rigid experiment (unused during scripted collection)
  discount: 0.99
  random_steps: 300
  training_starts: 5000
  batch_size: 256
  max_episode_steps: 400
