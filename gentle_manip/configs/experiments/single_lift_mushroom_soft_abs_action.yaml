# [experiment] SOFT mushroom lift, abs action — mirror of single_lift_mushroom_rigid_abs_action.yaml
# Used by: collect_demos_synth_v3 (FEM-gentleness grasp collection on the SOFT sim)
# Status: active
#
# Same composition as the RIGID abs-action experiment (action, DR, obs views, rl) EXCEPT the
# task is the SOFT MPM mushroom (single_lift_mushroom_soft_abs, substep 230). Tests whether a
# deformable object lifts more reliably than rigid under the FEM-gentleness grasps.
task: single_lift_mushroom_soft_abs
action: abs_pose_abs_gripper
dr: rigid_orientation         # ±45° pitch/roll, full yaw — same pose DR as the rigid experiment
augmentation: l515_noise

obs: superset_soft            # soft superset (privileged incl. von Mises stress) + point_cloud
views:
  teacher: [privileged]
  student: [point_cloud]

rl:                           # mirrors the rigid experiment (unused during scripted collection)
  discount: 0.99
  random_steps: 300
  training_starts: 5000
  batch_size: 256
  max_episode_steps: 400
