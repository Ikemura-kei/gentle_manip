# [experiment] SOFT mushroom lift — COARSE sim (98/105) + BOOSTED success/lift + stress.scale=2.0.
#              Same as single_lift_mushroom_soft_boost_ss0p5_coarse except rewards.stress.scale.
# Used by: serl_sim_server.py (--experiment) + DPPO finetune (experiment snapshot)
# Status: experimental (2026-07-15)
#
# Higher-stress-penalty variant of qfudm (coarse 98/105, success 2.0, lift 0.2). Tests whether a
# stronger penalty (2.0 vs 0.5) makes a coarse-trained policy gentler on the FINE reference sim.
task: single_lift_mushroom_soft_boost_ss2p0_coarse
action: delta_pose_delta_gripper
dr: food_shape
augmentation: l515_noise
obs: superset_soft
views:
  teacher: [privileged]
  student: [point_cloud]
rl:
  random_steps: 200
  training_starts: 400
  batch_size: 256
  discount: 0.92
  utd_ratio: 2
  critic_lr: 1.0e-4
