# [experiment] TOY/EASY rigid kiwi lift -- third confirmation of the toy-task
# finding, chosen specifically because kiwi has NO gripper-margin warning
# (unlike apple/avocado/pear) -- tests "comfortable grasp margin" as the
# refined hypothesis (see rigid_orientation_kiwi_easy.yaml and
# docs/cross_category_specialist_log.md).
# Used by: grasp_synthesis collect_demos_synth_v2/v3.py; DPPO train/eval
# Status: experimental
task: single_lift_kiwi_rigid
action: delta_pose_delta_gripper_fast_rot
dr: rigid_orientation_kiwi_easy
augmentation: l515_noise

obs: superset_rigid
views:
  teacher: [privileged]
  student: [point_cloud]

rl:
  discount: 0.99
  random_steps: 300
  training_starts: 5000
  batch_size: 256
  max_episode_steps: 400
