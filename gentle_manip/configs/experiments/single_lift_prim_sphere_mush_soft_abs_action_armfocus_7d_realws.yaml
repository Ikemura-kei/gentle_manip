# [experiment] prim_sphere EVAL variant of the collection experiment: 7-dim euler-absolute actions.
# Used by: dppo_eval.sbatch (SIM_EXPERIMENT/EVAL_EXPERIMENT) for the 12-object generalist
# Status: active (2026-09-01)
#
# IDENTICAL to single_lift_prim_sphere_mush_soft_abs_action_armfocus except `action:` -- the policy is trained on 7-dim
# euler-absolute (derived at conversion), so EVAL must decode that space. A 10-dim config
# here is inert at collection but FATAL at eval (ActionPipeline indexes [:,9] -> IndexError
# inside the sim server, surfacing only as 'socket closed mid-message'). See CHECKLISTS S0.
task: single_lift_prim_sphere_mush_soft
action: abs_pose_euler_abs_gripper
dr: soft_orientation_realws_prim_sphere_mush
augmentation: l515_noise

obs: superset_soft_armfocus   # quat + arm-focus cloud + privileged aux labels
views:
  teacher: [privileged]
  student: [point_cloud]       # ee_pos + ee_quat + gripper + point_cloud (obs_dim 8)

rl:
  discount: 0.99
  random_steps: 300
  training_starts: 5000
  batch_size: 256
  max_episode_steps: 400
