# 6D delta pose (x, y, z, roll, pitch, yaw) + 1D gripper
# Policy outputs in [-1, 1]; scales convert to physical units.
# Gripper scale shrunk 0.05 -> 0.005 (2026-07-02): under an RL policy that explores the
# full [-1,1], the old 0.05 made the gripper snap fully open/closed in ~2 steps. At 0.005,
# ±1 -> ±0.005 m/step (~16 steps across the 0.08 m opening) — gentle, finer control.
# NOTE: demos recorded BEFORE this change stored gripper actions at the old scale (~±0.05);
# to preserve physical grip speed they must be rescaled ×10 (→ ±0.5). The mushroom RL demo
# (demos_serl/mushroom_teacher.pkl) has been rescaled; older demos have NOT — check per-demo.
scales: [0.0052, 0.0052, 0.006, 0.001, 0.001, 0.001, 0.005]
clip: [-1.0, 1.0]
