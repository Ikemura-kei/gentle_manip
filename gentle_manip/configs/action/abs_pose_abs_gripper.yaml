# [action] Absolute EE pose (xyz + 6D rotation) + absolute gripper width.
# Used by: experiments (action:) -> training + deploy, when trying absolute-pose control
#          as an alternative to delta_pose_delta_gripper_fast_rot.yaml.
# Status: experimental
#
# Policy outputs 10 raw dims in [-1, 1] (or `clip`, if overridden):
#   [0:3] position     -> linearly mapped into [pos_min, pos_max]  (meters, robot base frame)
#   [3:9] 6D rotation   -> Gram-Schmidt orthonormalized (Zhou et al. 2019) into a quaternion;
#                          NOT scaled/mapped like the other dims — GS re-normalizes any raw
#                          (unconstrained) 6-vector into a valid, continuous rotation.
#   [9]   gripper       -> linearly mapped into [gripper_min, gripper_max]  (meters)
#
# ActionPipeline.process() returns the 8-dim physical command
# (pos(3) + quat_wxyz(4) + gripper(1)) that the backend SETS DIRECTLY each step (no
# delta accumulation) — sim_backend.py / real_backend.py dispatch on this 8-wide output
# automatically (vs the 7-wide delta output), so no other wiring changes are needed.
#
# pos_min/pos_max mirror the XArm7 EE workspace bounds (xarm7_config.EE_BOUNDS_MIN/MAX).
# gripper range is the real gripper's full physical opening (0-88mm).
mode: absolute
clip: [-1.0, 1.0]

pos_min: [0.26, -0.225, 0.003]
pos_max: [0.59,  0.225, 0.50]

gripper_min: 0.0
gripper_max: 0.088
