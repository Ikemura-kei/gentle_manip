# [obs] point_cloud_1cam_armfocus + PAIRED RGB (cam_ext) — fork for REAL demo collection
# Used by: demos/record.py real collection complementing the 12-obj generalist (cotrain + VLA-ready)
# Status: active (2026-09-01)
#
# IDENTICAL cloud view to point_cloud_1cam_armfocus.yaml (the generalist's student/deploy view)
# with ONE addition: `images:` passes cam_ext RGB into the recorded obs as
# obs["image_cam_ext"] (N, 480, 640, 3) uint8 — INSIDE the obs dict, so the frames are
# idle-trimmed together with every other channel: RGB step i == cloud/proprio step i by
# construction (the --record-rgb mp4 does NOT have this property; it skips the trim).
# ~0.9 MB/frame uncompressed; ~250-step episode ≈ 230 MB, 20 eps/object ≈ 4.6 GB.
#
include_joint_pos: false
include_joint_vel: false

quat_noise_std: 0.003

point_cloud:
  cameras: ["cam_ext"]
  crop_min: [0.2, -0.215, 0.019]   # z_min 19mm (2026-09-03): clears the 14mm board in BOTH sim and real; 16mm left 0.8% of board points after the extrinsic correction, 18mm leaves 0.00% over 10 frames
  crop_max: [0.71,   0.215,  0.45]
  max_points: 1024

  # Real-only flying-pixel / edge denoiser (no-op on clean sim).
  outlier_removal:
    voxel_size: 0.01
    min_neighbors: 23

  # Arm-focus: downweight arm-body points so the 1024-pt budget concentrates on the object.
  # SHARED sim+real — must match the training obs (superset_rigid_armfocus) exactly.
  object_focus:
    z_lo: 0.15          # keep points below this at full weight (table + resting object)
    r_ee: 0.11          # 0.13 -> 0.11 (2026-09-03): drops the gripper CABLE (real-only geometry,
                        #   not in sim) from 1.6% to 0.0% of high points while the object stays
                        #   100% kept — measured. finger-safe SPHERE radius around the EE (gripper + grasped/lifted object)
    arm_weight: 0.15    # arm-body points sampled at 0.15x (budget goes to the object)

images:
  cameras: ["cam_ext"]   # -> obs["image_cam_ext"], paired by construction
