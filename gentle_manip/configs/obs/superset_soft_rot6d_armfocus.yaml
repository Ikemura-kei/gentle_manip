# [obs] SUPERSET soft rot6d + SOFT ARM-FOCUS point cloud — fork of superset_soft_rot6d.yaml.
# Used by: single_lift_mushroom_soft_abs_action_rot6d_armfocus (FEM demo collection / training)
# Status: experimental (redistribute point-cloud samples toward the object)
#
# IDENTICAL to superset_soft_rot6d.yaml EXCEPT the point cloud adds object_focus with arm_weight:
# the fixed max_points budget is SOFT-weighted toward the object — arm-body points (high AND far from
# the EE) get sampling weight 0.15, while the object region (z < z_lo, table+resting object) and the
# finger-safe zone (within r_ee of the EE, gripper + grasped/lifted object) stay full weight. So the
# policy sees a denser object with SOME arm context retained (not the hard drop of focus_object).
# Heuristic only (points + ee_pos) — no CAD/FK — so it runs identically in sim and real. CHANGES the
# obs distribution => train + deploy with it consistently (do NOT mix with an unfocused checkpoint).
include_joint_pos: false
include_joint_vel: false
quat_noise_std: 0.003
ee_rot6d: true

privileged:
  object_pos: true
  object_vel: true
  stress: true

point_cloud:
  cameras: ["cam_ext"]
  crop_min: [0.2, -0.215, 0.004]
  crop_max: [0.71,   0.215,  0.45]
  max_points: 1024
  outlier_removal:
    voxel_size: 0.01
    min_neighbors: 23
  object_focus:
    z_lo: 0.15          # keep points below this at full weight (table + resting object)
    r_ee: 0.13          # finger-safe radius around the EE (gripper + grasped/lifted object)
    arm_weight: 0.15    # arm-body points sampled at 0.15x (fewer survive -> budget goes to object)
