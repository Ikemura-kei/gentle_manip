# [obs] 1-cam point cloud, real-deploy for an ARM-FOCUS-trained checkpoint (e.g. vqgsn, armfocus).
# Used by: deploy_real.py / deploy_real_dppo.py
# Status: active
#
# Real-deploy obs for a policy trained with the arm-focus cloud (superset_rigid_armfocus /
# superset_soft_armfocus). IDENTICAL to point_cloud_1cam_outlier.yaml (same cam, crop, max_points,
# real-only outlier denoise) PLUS object_focus — because object_focus is SHARED sim+real geometry
# (the arm is present in both), so a policy trained with the arm downweighted MUST be deployed the
# same way, or the cloud distribution won't match. The object_focus params below are copied verbatim
# from the training obs (superset_rigid_armfocus) so the real cloud is sampled identically.
# quat proprio (obs_dim 8). No privileged block (sim-only; real deploy runs task=None).
include_joint_pos: false
include_joint_vel: false

quat_noise_std: 0.003

point_cloud:
  cameras: ["cam_ext"]
  crop_min: [0.2, -0.215, 0.019]   # z_min 19mm (2026-09-03): clears the 14mm board in BOTH sim and real; 16mm left 0.8% of board points after the extrinsic correction, 18mm leaves 0.00% over 10 frames
  crop_max: [0.71,   0.215,  0.45]
  max_points: 1024

  # Real-only flying-pixel / edge denoiser (no-op on clean sim).
  outlier_removal:
    voxel_size: 0.01
    min_neighbors: 23

  # Arm-focus: downweight arm-body points so the 1024-pt budget concentrates on the object.
  # SHARED sim+real — must match the training obs (superset_rigid_armfocus) exactly.
  object_focus:
    z_lo: 0.12          # 0.15 -> 0.12 (2026-09-03). Sized by the TALLEST object we have (0.10 m):
                        #   resting on the 14 mm board it tops out at ~114 mm, so z_lo must clear
                        #   that. This clause admits ANY point below z_lo at ANY distance from the
                        #   TCP, so it — not r_ee — is what lets the gripper CABLE through; 0.12
                        #   still passes ~181/1024 far-from-TCP points. Going lower would start
                        #   clipping the object, so the cable is NOT fully separable by world
                        #   height: a TCP-FRAME AXIAL cut is the clean fix (see DEVLOG).
                        #   Crop z_min=19mm already removes the table; a LIFTED object rides r_ee.
    r_ee: 0.11          # finger-safe SPHERE around the EE (gripper + grasped object).
                        #   0.13 left 1.0% cable points under hard focus; 0.11 -> 0.0%.
