# State-based RL TEACHER obs (SIM ONLY): proprioception (ee_pos/ee_quat/gripper_width,
# always included) + PRIVILEGED info read from the sim — true object pose/velocity and
# the normalized von Mises stress (the gentleness signal the deployable student can't
# observe). Train a SAC teacher on this, then distill to a point-cloud student that
# uses point_cloud_1cam(_outlier).yaml instead.
#
# No camera modality -> ObsConfig.needs_cameras() is False, so SimBackend(render_cameras
# =False) skips the per-env depth render (observation-only; dynamics unchanged). Must
# NOT be used for real/student deployment (privileged requires the sim).
include_joint_pos: false
include_joint_vel: false
quat_noise_std: 0.003

privileged:
  object_pos: true     # SimFeedback.object_center (N,3) — the teacher's "where is the object"
  object_vel: true     # per-step object displacement (N,3)
  stress: true         # normalized von Mises [mean/yield, top10/yield] (N,2) — anti-bruising
