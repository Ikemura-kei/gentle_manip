# [obs] superset_soft_armfocus + priv_stress — for validating the FEM surrogate against the MPM sim.
# Used by: single_lift_*_soft_abs_action_armfocus_stress experiments (validation only)
# Status: experimental (auxiliary-objective IL: denser object cloud + privileged aux labels)
#
# Fork of superset_soft.yaml (quat proprio, obs_dim 8) with two changes for the aux-objective work:
#   1. Point cloud adds object_focus with arm_weight: the 1024-point budget is soft-weighted toward
#      the object (arm-body points at 0.15x, object + finger-safe near-EE SPHERE at full weight), so
#      the object is denser — helps BOTH the policy and the aux predictors (contact / object position).
#   2. Privileged fields are exactly the AUX LABELS (training-time only, recorded by the collector):
#      priv_object_pos = object COM (3D regression target); priv_contact = PROPER binary gripper-object
#      contact (geometric finger<->particle proximity — NOT a stress proxy: a soft object stresses
#      under its own weight with nothing touching it). Heuristic focus (points + ee_pos), no CAD/FK.
# Train + deploy consistently with this obs.
include_joint_pos: false
include_joint_vel: false
quat_noise_std: 0.003
privileged:
  stress: true              # priv_stress (N,2) [mean, top10]/yield — MPM-MEASURED, for the
                            # surrogate-vs-simulator correlation check (see docs/grasp_synthesis_model.md)
  object_pos: true          # AUX LABEL: object position (COM) — 3D regression target
  contact: true             # AUX LABEL: proper binary gripper-object contact (geometric, not stress)
point_cloud:
  cameras: ["cam_ext"]
  crop_min: [0.2, -0.215, 0.004]
  crop_max: [0.71,   0.215,  0.45]
  max_points: 1024
  outlier_removal:
    voxel_size: 0.01
    min_neighbors: 23
  object_focus:
    z_lo: 0.06          # 0.15 -> 0.06 (2026-09-03). This clause — NOT r_ee — is what was keeping
                        #   the gripper CABLE: it admits ANY point below z_lo at ANY distance from
                        #   the TCP. Measured: at 0.15, 349 of 1024 points sat 0.110-0.174 m from the
                        #   TCP (cable + upper gripper); at 0.06, zero. Its remaining job is only the
                        #   RESTING OBJECT (board 14mm + object ~35mm -> tops out ~50mm), since crop
                        #   z_min=19mm already removes the table. A LIFTED object is covered by r_ee.
    r_ee: 0.11          # finger-safe SPHERE around the EE (gripper + grasped object).
                        #   0.13 left 1.0% cable points under hard focus; 0.11 -> 0.0%.
