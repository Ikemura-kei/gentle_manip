# [obs] SUPERSET for the 13.8 mm BOARD rig (D435i, 2026-09-03) — soft tasks.
# Used by: grasp_synthesis collection + DPPO training on single_lift_cube3_soft_board
# Status: active
#
# ADDITIVE copy of superset_soft_armfocus.yaml with ONE change: crop z_min 0.004 -> 0.019,
# matching the real deploy config now that a 13.8 mm board sits under the object. The shared
# superset is deliberately NOT edited: tasks without a board rest the object on the table at
# z~0, where a 19 mm floor would slice off its base.
# Everything else (armfocus z_lo 0.12 / r_ee 0.11 / HARD focus, 1024 pts, privileged block)
# is identical, so this pairs with point_cloud_1cam_armfocus.yaml on the real side.
include_joint_pos: false
include_joint_vel: false
quat_noise_std: 0.003
privileged:
  stress: true              # priv_stress (N,2) = [mean, top10] / yield. Recorded so the FROZEN
                            # dataset carries a PER-EPISODE gentleness record: needed to (a) filter
                            # demos that exceed yield and (b) state the sub-yield fraction of the
                            # actual dataset rather than of a proxy sample. Privileged-only, and the
                            # DPPO views are explicit key lists, so this does NOT change the student
                            # (point-cloud) obs or any converted view — it is additive metadata.
  object_pos: true          # AUX LABEL: object position (COM) — 3D regression target
  contact: true             # AUX LABEL: proper binary gripper-object contact (geometric, not stress)
point_cloud:
  cameras: ["cam_ext"]
  crop_min: [0.2, -0.215, 0.019]   # board rig: matches real deploy
  crop_max: [0.71,   0.215,  0.45]
  max_points: 1024
  outlier_removal:
    voxel_size: 0.01
    min_neighbors: 23
  object_focus:
    z_lo: 0.12          # 0.15 -> 0.12 (2026-09-03). Sized by the TALLEST object we have (0.10 m):
                        #   resting on the 14 mm board it tops out at ~114 mm, so z_lo must clear
                        #   that. This clause admits ANY point below z_lo at ANY distance from the
                        #   TCP, so it — not r_ee — is what lets the gripper CABLE through; 0.12
                        #   still passes ~181/1024 far-from-TCP points. Going lower would start
                        #   clipping the object, so the cable is NOT fully separable by world
                        #   height: a TCP-FRAME AXIAL cut is the clean fix (see DEVLOG).
                        #   Crop z_min=19mm already removes the table; a LIFTED object rides r_ee.
    r_ee: 0.11          # finger-safe SPHERE around the EE (gripper + grasped object).
                        #   0.13 left 1.0% cable points under hard focus; 0.11 -> 0.0%.