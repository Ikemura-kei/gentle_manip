# [obs] SUPERSET rigid (quat) + SOFT ARM-FOCUS point cloud — fork of superset_rigid.yaml.
# Used by: single_lift_mushroom_rigid_abs_action_armfocus (SDF + FEM demo collection / training / eval)
# Status: experimental (does object-focused point sampling help the policy?)
#
# IDENTICAL to superset_rigid.yaml (quat proprio, obs_dim 8) EXCEPT the point cloud adds object_focus
# with arm_weight: the fixed 1024-point budget is SOFT-weighted toward the object — arm-body points
# (high AND far from the EE) get sampling weight 0.15, while the object region (z < z_lo) and the
# finger-safe SPHERE (within r_ee of the EE — a Euclidean ball, orientation-invariant) stay full weight.
# Heuristic only (points + ee_pos), no CAD/FK, identical sim/real. CHANGES the obs distribution =>
# train + deploy with it consistently.
include_joint_pos: false
include_joint_vel: false
quat_noise_std: 0.003

privileged:
  object_pos: true
  object_vel: true
  stress: false          # rigid -> no von Mises

point_cloud:
  cameras: ["cam_ext"]
  crop_min: [0.2, -0.215, 0.004]
  crop_max: [0.71,   0.215,  0.45]
  max_points: 1024
  outlier_removal:
    voxel_size: 0.01
    min_neighbors: 23
  object_focus:
    z_lo: 0.06          # 0.15 -> 0.06 (2026-09-03). This clause — NOT r_ee — is what was keeping
                        #   the gripper CABLE: it admits ANY point below z_lo at ANY distance from
                        #   the TCP. Measured: at 0.15, 349 of 1024 points sat 0.110-0.174 m from the
                        #   TCP (cable + upper gripper); at 0.06, zero. Its remaining job is only the
                        #   RESTING OBJECT (board 14mm + object ~35mm -> tops out ~50mm), since crop
                        #   z_min=19mm already removes the table. A LIFTED object is covered by r_ee.
    r_ee: 0.11          # finger-safe SPHERE around the EE (gripper + grasped object).
                        #   0.13 left 1.0% cable points under hard focus; 0.11 -> 0.0%.
