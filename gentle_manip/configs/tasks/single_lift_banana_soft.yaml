# [task] Soft banana lift (~9.5 cm crescent, 3.24 cm thick — the thickness is the grasp width).
# Used by: experiments/single_lift_banana_soft_abs_action_armfocus.yaml
# Status: experimental (multi-object synthesis probe, 2026-08-26)
#
# MPM: at the 9.5 cm nominal size the banana is ~73 cm^3, so the mushroom's grid density 250
# gives ~1.1k particles at 4 mm cells (~8 cells across the 3.24 cm thickness) — comparable
# resolution to the mushroom's 842. substeps scale with grid density and sqrt(E)
# (0.25 vs 0.3 MPa): 235*sqrt(0.25/0.3) ~ 214, rounded to 240.
object_name: "banana"
object_type: "soft"
mpm_grid_density: 250
sim_substeps: 240
mpm_bounds: [[0.20, -0.20, -0.03], [0.57, 0.20, 0.30]]

success_z_min: 0.150
success_z_max: 0.280
hold_steps: 30
success_scale: 0.2

rewards:
  stress:
    scale: 0.2
    cap: 1.5                 # fraction of the banana's OWN 25 kPa yield (auto-injected)
    mean_weight: 0.2
    top10_weight: 0.8
  dist_to_obj:
    scale: 0.1
    decay: 8.0
  lift:
    scale: 0.1
    grasp_gate_dist: 0.060   # the banana is elongated, so "near the object" is looser than a mushroom's
    lift_target: 0.13
