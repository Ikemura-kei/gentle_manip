# [task] Soft banana lift (~9.5 cm crescent, 1.86 cm thick — the thickness is the grasp width).
# Used by: experiments/single_lift_banana_soft_abs_action_armfocus.yaml
# Status: experimental (multi-object synthesis probe, 2026-08-26)
#
# Mesh re-prepped 2026-08-26 from the seed0 scan: the FIRST banana asset was mis-prepped
# (73 cm^3, 9.5 x 9.2 x 3.24 cm) because the stem cut removed ~35% of the banana's LENGTH,
# so `--target-extent 0.095` then landed on the CURVE SPAN instead of the banana and scaled
# the whole object up ~1.5x. Correct asset: 9.5 x 7.07 x 1.86 cm, 26 cm^3.
#
# MPM: the banana is now THIN (1.86 cm), so grid density 250 (4 mm cells) would put only
# ~4.6 cells across the thickness — too coarse to resolve a grasp. 300 gives 3.3 mm cells
# (~5.6 cells) at ~2.7k particles. substeps scale with grid density and sqrt(E):
# 240 * (300/250) ~ 288, rounded to 290.
object_name: "banana"
object_type: "soft"
mpm_grid_density: 300
sim_substeps: 290
mpm_bounds: [[0.20, -0.20, -0.03], [0.57, 0.20, 0.30]]

success_z_min: 0.150
success_z_max: 0.280
hold_steps: 30
success_scale: 0.2

rewards:
  stress:
    scale: 0.2
    cap: 1.5                 # fraction of the banana's OWN 25 kPa yield (auto-injected)
    mean_weight: 0.2
    top10_weight: 0.8
  dist_to_obj:
    scale: 0.1
    decay: 8.0
  lift:
    scale: 0.1
    grasp_gate_dist: 0.060   # the banana is elongated, so "near the object" is looser than a mushroom's
    lift_target: 0.13
