# [task] Rigid banana single-lift (rigid material, no stress reward) -- fast SURROGATE
# for the soft-MPM banana lift used in the OmniReset-inspired diverse-start regrasp
# campaign (docs/HANDOFF_banana_rigid_diverse_2026-08-28.md). Rigid physics is ~40x
# cheaper per step than soft MPM, so it is the iteration vehicle for the collector +
# BC-policy regrasp behaviour before paying for a soft or real-robot collection.
# Used by: experiments (task:) single_lift_banana_rigid_diverse -> diverse-start
#          demo collection, DPPO training/eval
# Status: experimental
#
# Mirrors single_lift_apple_rigid.yaml (same success band / reward shape / settle
# params) with banana's own mesh + registry material (object_type forced rigid).
success_z_min: 0.175
success_z_max: 0.275
hold_steps: 30
object_name: "banana"
object_type: "rigid"

sim_substeps: 5
mpm_grid_density: 250    # unused (no MPM entity), kept for SceneSpec

settle_steps: 30
settle_max_steps: 200
settle_vel_thresh: 0.0005

success_scale: 2.0

rewards:
  dist_to_obj:
    scale: 1.0
    decay: 8.0
  lift:
    scale: 1.0
    grasp_gate_dist: 0.079
    lift_target: 0.16
