# [task] Cross-category diverse-start COLLECTION task: the object actually spawned
# is drawn per scene from dr: xcat_diverse_regrasp (object_category_pool), not from
# object_name below (nominal/fallback only). Success band / reward here are used by
# the eval harness path; the diverse-start collector uses its own internal
# lifted-clear success (obj_z rises with the gripper) so the band is not critical
# for collection.
# Used by: experiments (task:) single_lift_xcat_diverse
# Status: experimental
#
# Pool = 4 mushroom-scale soft objects (3-6 cm): mushroom, banana_lying, kiwi,
# egg_boiled. Dropped: the <=2 cm fruit (grape/cherry/tomato/raspberry -- degenerate
# deformed meshes, ~64 MPM particles) and strawberry (1.4 KB placeholder mesh breaks
# the SDF BVH). "adjust if any collect badly". E span 1.5e5 (egg) .. 4e5 (kiwi).
# Physics = the banana COLLECTION values (grid 250 / substeps 240) that yielded
# 54%% grasp SR + confirmed regrasp. Slightly above banana's 220 substeps for kiwi
# (E 4e5). Occasional NaN blowups are caught by the collector's per-batch skip.
# The EVAL task (single_lift_xcat_diverse_eval) uses the CFL-safe grid 190/substeps 440.
success_z_min: 0.16
success_z_max: 0.40
hold_steps: 6
object_name: "mushroom"        # nominal/fallback; dr.object_category_pool overrides per scene
object_type: "soft"
sim_substeps: 240
mpm_grid_density: 250
success_scale: 0.2
rewards:
  stress:      {scale: 0.2, cap: 1.5, mean_weight: 0.2, top10_weight: 0.8}
  dist_to_obj: {scale: 0.1, decay: 8.0}
  lift:        {scale: 0.1, grasp_gate_dist: 0.079, lift_target: 0.16}
