# [task] Rigid tofu single-lift (primitive box, no mesh needed -- a cut tofu piece
# is well-approximated by a cuboid). Material updated to a literature citation
# (56.7 kPa compression stiffness, see materials.py).
# Used by: experiments (task:) -> demo collection, DPPO training
# Status: active
success_z_min: 0.175
success_z_max: 0.275
hold_steps: 30
object_name: "tofu"
object_type: "rigid"

sim_substeps: 5
mpm_grid_density: 250

settle_steps: 30
settle_max_steps: 200
settle_vel_thresh: 0.0005

success_scale: 2.0

rewards:
  dist_to_obj:
    scale: 1.0
    decay: 8.0
  lift:
    scale: 1.0
    grasp_gate_dist: 0.079
    lift_target: 0.16
