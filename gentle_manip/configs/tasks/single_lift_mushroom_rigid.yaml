# [task] Rigid mushroom single-lift (same mesh, Rigid material, no stress reward): fast debug + rigid->soft base.
# Used by: experiments (task:) -> SERL, demo collection
# Status: active
#
# RIGID mushroom lift — same mesh/geometry as mushroom_lift, but a Rigid material.
# Purpose: fast debugging of basic training (no MPM CFL -> low substeps -> ~10x faster),
# and the base policy for a rigid->soft curriculum (later finetune on the soft version).
# No stress reward (rigid has no von Mises). Reward at STANDARD scale + discount 0.99:
# the ×0.1 + discount 0.92 band-aids (added to fight divergence pre-REDQ) starved learning
# (REDQ kept critic_loss ~0.008 but return stuck at ~5 = policy stays home). With the REDQ
# critic ensemble now handling Q-overestimation, the full reward signal + long horizon are
# restored (the proven-project regime).
success_z_min: 0.175
success_z_max: 0.275          # widened from 0.225 (2026-07-29): eval diagnosis of a trained
                              # point-cloud abs-action policy (cho/ahaxs, ckpt state_800) showed
                              # it stably overshooting to obj_z ~0.23-0.25 while videos clearly
                              # show a successful, held lift — not oscillation/failure. Ruled out
                              # a demo-data or eval-horizon cause first: the cho demos' own final
                              # object z is 0.209+-0.005 (649/650 already inside the old band), so
                              # the offset is the trained policy's, not inherited. Widening the
                              # upper bound accepts "lifted a bit higher than the demos" as still
                              # successful, rather than penalizing an otherwise-good grasp+lift.
hold_steps: 30
object_name: "mushroom"
object_type: "rigid"     # <-- the only material difference from mushroom_lift

# Rigid: no MPM CFL limit, so few substeps -> much faster than the soft mushroom's 210.
sim_substeps: 5
mpm_grid_density: 250    # unused (no MPM entity) but kept for SceneSpec

# Rigid objects roll for many more steps than soft — wait until velocity drops below
# thresh rather than a fixed count. 30 warmup steps + up to 200 extra (vel-gated).
settle_steps: 30
settle_max_steps: 200
settle_vel_thresh: 0.0005  # m/s — stop waiting once all rigid objects are below this

success_scale: 2.0

rewards:
  # No stress term (rigid). Approach + lift + sparse success only. Standard scale.
  dist_to_obj:
    scale: 1.0
    decay: 8.0
  lift:
    scale: 1.0
    grasp_gate_dist: 0.079
    lift_target: 0.16
