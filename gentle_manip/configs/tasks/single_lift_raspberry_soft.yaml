# [task] Soft-MPM raspberry single-lift: object + reward (dist/lift/stress) + success band + sim dynamics.
# Used by: experiments (task:) -> DP3/DPPO, demo collection
# Status: experimental
#
# Fragile-food 25-category campaign (2026-08-13). Mirrors single_lift_mushroom_soft.yaml's
# validated structure (Config C reward shaping/success-band convention) -- only object_name
# and the MPM stability params (sim_substeps/mpm_grid_density, from registry.py's
# sim_substeps_override when set) differ per object.
success_z_min: 0.175
success_z_max: 0.275
hold_steps: 30
object_name: "raspberry"
object_type: "soft"

sim_substeps: 220
mpm_grid_density: 250

success_scale: 0.2

rewards:
  stress:
    scale: 0.2
    cap: 1.5
    mean_weight: 0.2
    top10_weight: 0.8
  dist_to_obj:
    scale: 0.1
    decay: 8.0
  lift:
    scale: 0.1
    grasp_gate_dist: 0.079
    lift_target: 0.16
