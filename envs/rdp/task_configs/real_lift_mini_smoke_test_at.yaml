# Stage 1 (Asymmetric Tokenizer) smoke-test task config for the "lift" mini dataset,
# 24fps variant (dataset_mini/lift_v2_downsample1_zarr). Sibling of
# real_lift_mini_smoke_test.yaml (the plain-DP config) — same reasoning applies: the
# shipped real_lift_image_tactile_emb_at_absolute_24fps.yaml assumes a fully bimanual
# tactile rig (right_gripper1_marker_offset_emb) this mini recording doesn't have.
# Not shipped upstream; copy into
# third_party/reactive_diffusion_policy/reactive_diffusion_policy/config/task/ before use.
#
# Obs set mirrors real_lift_mini_smoke_test.yaml (the DP baseline) exactly — including
# both tactile channels (left_gripper1 = McTac, all-zero/dead in this recording;
# left_gripper2 = GelSight, real signal) — so the DP vs RDP comparison sees the same
# inputs and isolates the architectural difference, not a modality difference.
defaults:
  - real_lift_three_realsense_one_mctac_one_gelsight_24fps@_here_
  - _self_

name: real_lift_mini_smoke_test_at

dataset_path: data/lift_v2_downsample1_zarr

shape_meta: &shape_meta
  obs:
    left_robot_tcp_pose:
      shape: [3]
      type: low_dim
    left_robot_gripper_width:
      shape: [1]
      type: low_dim
    right_robot_tcp_pose:
      shape: [3]
      type: low_dim
    right_robot_gripper_width:
      shape: [1]
      type: low_dim
    left_gripper1_marker_offset_emb:
      shape: [189]
      type: low_dim
    left_gripper2_marker_offset_emb:
      shape: [15]
      type: low_dim
  extended_obs: # high-freq tactile fed straight to the AT's RNN decoder
    left_gripper1_marker_offset_emb:
      shape: [189]
      type: low_dim
    left_gripper2_marker_offset_emb:
      shape: [15]
      type: low_dim
  action:
    shape: [8] # (4 + 4) (x_l, y_l, z_l, x_r, y_r, z_r, gripper_width_l, gripper_width_r)

dataset:
  _target_: reactive_diffusion_policy.dataset.real_image_tactile_dataset.RealImageTactileDataset
  shape_meta: *shape_meta
  dataset_path: ${task.dataset_path}
  horizon: ${horizon}
  pad_before: ${eval:'${dataset_obs_steps}-1+${n_latency_steps}'}
  pad_after: ${eval:'${n_action_steps}-1'}
  n_obs_steps: ${dataset_obs_steps}
  obs_temporal_downsample_ratio: ${dataset_obs_temporal_downsample_ratio}
  n_latency_steps: ${n_latency_steps}
  seed: 42
  val_ratio: 0.0
  max_train_episodes: null
  delta_action: False
  relative_action: False
