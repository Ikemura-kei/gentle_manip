# Stage 2 (Latent Diffusion Policy) smoke-test task config for the "lift" mini dataset,
# 24fps variant (dataset_mini/lift_v2_downsample1_zarr). Sibling of
# real_lift_mini_smoke_test_at.yaml (stage 1) and real_lift_mini_smoke_test.yaml (the
# plain-DP baseline) — same obs set as both, so all three models see identical inputs.
# Not shipped upstream; copy into
# third_party/reactive_diffusion_policy/reactive_diffusion_policy/config/task/ before use.
# Requires a trained AT checkpoint passed in as `at_load_dir` (see train_rdp.sh for the
# two-stage invocation pattern).
defaults:
  - real_lift_three_realsense_one_mctac_one_gelsight_24fps@_here_
  - _self_

name: real_lift_mini_smoke_test_ldp

image_shape: [3, 240, 320]
dataset_path: data/lift_v2_downsample1_zarr

shape_meta: &shape_meta
  obs:
    external_img:
      shape: ${task.image_shape}
      type: rgb
    left_wrist_img:
      shape: ${task.image_shape}
      type: rgb
    left_robot_tcp_pose:
      shape: [3]
      type: low_dim
    left_robot_gripper_width:
      shape: [1]
      type: low_dim
    right_robot_tcp_pose:
      shape: [3]
      type: low_dim
    right_robot_gripper_width:
      shape: [1]
      type: low_dim
    left_gripper1_marker_offset_emb:
      shape: [189]
      type: low_dim
    left_gripper2_marker_offset_emb:
      shape: [15]
      type: low_dim
  extended_obs: # high-freq tactile fed straight to the AT's RNN decoder
    left_gripper1_marker_offset_emb:
      shape: [189]
      type: low_dim
    left_gripper2_marker_offset_emb:
      shape: [15]
      type: low_dim
  action:
    shape: [8] # (4 + 4) (x_l, y_l, z_l, x_r, y_r, z_r, gripper_width_l, gripper_width_r)

dataset:
  _target_: reactive_diffusion_policy.dataset.real_image_tactile_latent_diffusion_dataset.RealImageTactileLatentDiffusionDataset
  shape_meta: *shape_meta
  dataset_path: ${task.dataset_path}
  horizon: ${horizon}
  pad_before: ${eval:'${dataset_obs_steps}-1+${n_latency_steps}'}
  pad_after: ${eval:'${n_action_steps}-1'}
  n_obs_steps: ${dataset_obs_steps}
  obs_temporal_downsample_ratio: ${dataset_obs_temporal_downsample_ratio}
  n_latency_steps: ${n_latency_steps}
  seed: 42
  val_ratio: 0.0
  max_train_episodes: null
  delta_action: False
  relative_action: False

  use_latent_action_before_vq: False
  at:
    _target_: reactive_diffusion_policy.model.vae.model.VAE
    shape_meta: *shape_meta
    horizon: ${at.policy.horizon}
    n_latent_dims: ${at.policy.n_latent_dims}
    mlp_layer_num: ${at.policy.mlp_layer_num}
    use_conv_encoder: ${at.policy.use_conv_encoder}
    conv_latent_dims: ${at.policy.conv_latent_dims}
    conv_layer_num: ${at.policy.conv_layer_num}
    use_rnn_decoder: ${at.policy.use_rnn_decoder}
    rnn_latent_dims: ${at.policy.rnn_latent_dims}
    rnn_layer_num: ${at.policy.rnn_layer_num}
    use_vq: ${at.policy.use_vq}
    n_embed: ${at.policy.n_embed}
    vqvae_groups: ${at.policy.vqvae_groups}
    eval: true
    load_dir: ${at_load_dir}
    act_scale: ${at.policy.act_scale}
