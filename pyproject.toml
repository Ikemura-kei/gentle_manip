[project]
name = "gentle-manip"
version = "0.1.0"
requires-python = ">=3.10"
# Core deps are genesis-free and platform-agnostic — these alone are enough to
# run the real side of the RawObs boundary (perception, actions, real backend).
dependencies = [
    "numpy",
    "gymnasium",
    "scipy",   # rotation math in the real backend
    "pyyaml",  # YAML config loading
    "matplotlib",
]

# This is the shared LIBRARY definition — it is not synced into an environment
# itself. The per-Python environments live under envs/ (sim, deploy, dp3); each
# depends on `gentle-manip` (+ extras) and is run with `uv run --project envs/<name>`.
# Genesis is NOT declared here at all — envs/sim depends on the genesis fork
# directly, which is what keeps the real side (envs/deploy) genesis-free.
[project.optional-dependencies]
# Real-robot hardware SDKs. Pulled by the 3.11 envs/deploy. pyrealsense2 is
# pinned: 2.54.2.5684 is the last line supporting the discontinued L515 (cam_ext)
# and only ships cp310/cp311 wheels — hence envs/deploy is Python 3.11, not 3.12.
real = [
    "pyrealsense2==2.54.2.5684",
    "xArm-Python-SDK",
    "opencv-python>=4.8",
    "pyspacemouse",   # teleop input (wraps hidapi; needs libhidapi + a hidraw udev rule)
    "pygame",         # episode-control keyboard window for demo collection
    "open3d",         # live point-cloud viewer (crop tuning)
    "imageio",        # demo/episode video export (mp4)
    "imageio-ffmpeg", # ffmpeg backend for imageio mp4 encoding
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
